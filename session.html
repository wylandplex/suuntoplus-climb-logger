<uiView onLoad="
          var G='3a,3a+,3b,3b+,3c,3c+,4a,4a+,4b,4b+,4c,4c+,5a,5a+,5b,5b+,5c,5c+,6a,6a+,6b,6b+,6c,6c+,7a,7a+,7b,7b+,7c,7c+,8a,8a+,8b,8b+,8c,8c+,9a,9a+,9b,9b+,9c|4,4+,5-,5,5+,6-,6,6+,7-,7,7+,8-,8,8+,9-,9,9+,10-,10,10+,11-,11,11+,12-|5.5,5.6,5.7,5.8,5.9,5.10a,5.10b,5.10c,5.10d,5.11a,5.11b,5.11c,5.11d,5.12a,5.12b,5.12c,5.12d,5.13a,5.13b,5.13c,5.13d,5.14a,5.14b,5.14c,5.14d,5.15a,5.15b,5.15c,5.15d|4a,4b,4c,5a,5b,5c,6a,6b,6c,7a,7b|WI2,WI3,WI3+,WI4,WI4+,WI5,WI5+,WI6,WI6+,WI7,WI7+|M1,M2,M3,M4,M5,M6,M7,M8,M9,M10,M11,M12|VB,V0,V1,V2,V3,V4,V5,V6,V7,V8,V9,V10,V11,V12|4A,4A+,4B,4B+,4C,4C+,5A,5A+,5B,5B+,5C,5C+,6A,6A+,6B,6B+,6C,6C+,7A,7A+,7B,7B+,7C,7C+,8A,8A+,8B,8B+,8C,8C+'.split('|');
          function dG(x){return x>=0?(x%100>=50?'OFF':(G[Math.floor(x/100)]||'').split(',')[x%100]||'?'):'--'}
          $.subscribe('/Zapp/{zapp_index}/Output/editSend',function(v){
            setText('#resIco',String.fromCharCode(v?0xF200:0xF110));
            setText('#resLbl',v?'SEND':'FAIL');
            setStyle('#resIco','color',v?'#5cdd8b':'#ff6666');
          });
        ">
  <div id="climblogger">

    <!-- Title bar: EDIT N / TOTAL -->
    <div class="cm-fg" style="width:100%;height:16%">
      <div class="p-hc sp-vertical-center" style="top:calc(50% - 50%e);">
        <span class="sp-t-s" style="padding-right:4px">EDIT</span>
        <span class="sp-t-s f-num"><eval input="/Zapp/{zapp_index}/Output/routeNum" outputFormat="Count_Threedigits" default="0" /></span>
        <span class="sp-t-s" style="padding:0 2px">/</span>
        <span class="sp-t-s f-num"><eval input="/Zapp/{zapp_index}/Output/modeSub" outputFormat="Count_Threedigits" default="0" /></span>
      </div>
    </div>

    <!-- Up-arrow tap-bar (invisible wide target) = previous route -->
    <div onTap="$.put('/Zapp/{zapp_index}/Event', 1, null, 'int32');"
      style="top:17%;left:0;width:70%;height:22%;position:absolute;"></div>
    <div class="f-ico p-hc" style="top:calc(30% - 50%e);">&#xF266;</div>

    <!-- Grade display (hero, centered) -->
    <div class="sp-t-l" style="top:calc(48% - 50%e); left:calc(50% - 50%e);">
      <eval input="/Zapp/{zapp_index}/Output/lastGrade" outputFormat="script x => dG(x)" default="--" />
    </div>

    <!-- Result icon + label (dynamic via editSend subscription) -->
    <div class="p-hc sp-vertical-center" style="top:calc(68% - 50%e);">
      <span id="resIco" class="f-ico" style="padding-right:6px">&#xF110;</span>
      <span id="resLbl" class="sp-b-m">FAIL</span>
    </div>

    <!-- Down-arrow tap-bar = next route -->
    <div onTap="$.put('/Zapp/{zapp_index}/Event', 2, null, 'int32');"
      style="top:78%;left:0;width:70%;height:18%;position:absolute;"></div>
    <div class="f-ico p-hc" style="top:calc(82% - 50%e);">&#xF267;</div>

    <!-- Top pill: exit to STATS (event 4) -->
    <div style="top:18%;left:83%;width:15%;height:12%;position:absolute;">
      <div style="top:0; left:0; width:100%;height:100%;position:absolute;
                  background:rgba(255,255,255,0.15);
                  border-radius:40% 0 0 40%;">
        <div class="f-ico cm-bgc"
             style="top:calc(55% - 50%e); left:6px;">&#xE365;</div>
      </div>
    </div>
    <div onTap="$.put('/Zapp/{zapp_index}/Event', 4, null, 'int32');"
      style="top:11%;left:70%;width:30%;height:25%;position:absolute;"></div>

    <!-- Middle pill: toggle SEND/FAIL (event 3) -->
    <div style="top:44%;left:90%;width:10%;height:12%;position:absolute;">
      <div style="top:0; left:0; width:100%;height:100%;position:absolute;
                  background:rgba(255,255,255,0.15);
                  border-radius:40% 0 0 40%;">
        <div class="f-ico cm-bgc"
             style="top:calc(55% - 50%e); left:6px;">&#xF111;</div>
      </div>
    </div>
    <div onTap="$.put('/Zapp/{zapp_index}/Event', 3, null, 'int32');"
      style="top:37%;left:70%;width:30%;height:25%;position:absolute;"></div>

    <:if test="{{ HAS_ON_EVENT }}">
    <userInput>
      <pushButton name="up" type="lock" longType="lock"
        onClick="$.put('/Zapp/{zapp_index}/Event', 1, null, 'int32');"
        onLongPressStart="$.put('/Zapp/{zapp_index}/Event', 5, null, 'int32');" />
      <pushButton name="next" longType="lock"
        onClick="$.put('/Zapp/{zapp_index}/Event', 3, null, 'int32');"
        onLongPressStart="$.put('/Zapp/{zapp_index}/Event', 4, null, 'int32');" />
      <pushButton name="down" type="lock" longType="lock"
        onClick="$.put('/Zapp/{zapp_index}/Event', 2, null, 'int32');"
        onLongPressStart="$.put('/Zapp/{zapp_index}/Event', 6, null, 'int32');" />
    </userInput>
    </:if>

  </div>
</uiView>
