<uiView>
  <div id="climblogger">

    <!-- Title bar -->
    <div class="cm-fg" style="width:100%;height:16%">
      <div class="f-num" style="top:calc(50% - 50%e); left:calc(50% - 50%e); font-size: 14px;">
        <eval input="/Zapp/{zapp_index}/Output/modeSub" outputFormat="script x => x > 0 ? 'ROUTE ' + x : 'PROJECT ' + Math.abs(x)" default="ROUTE 1" />
      </div>
    </div>

    <!-- Grade (hero, tappable to cycle in free mode) -->
    <div onTap="$.put('/Zapp/{zapp_index}/Event', 1, null, 'int32');"
      style="top:16%;left:0%;width:100%;height:36%;position:absolute;">
      <div class="f-num" style="top:calc(45% - 50%e); left:calc(50% - 50%e); font-size: 56px;">
        <eval input="/Zapp/{zapp_index}/Output/grade" outputFormat="Count_Threedigits" default="5" />
      </div>
      <div class="cm-mid" style="top:calc(75% - 50%e); left:calc(50% - 50%e); font-size: 12px;">GRADE</div>
    </div>

    <!-- START button -->
    <div onTap="$.put('/Zapp/{zapp_index}/Event', 3, null, 'int32');"
      style="top:53%;left:15%;width:70%;height:14%;position:absolute;">
      <div style="top:calc(50% - 50%e); left:calc(50% - 50%e);
                  width:80%;height:65%;position:absolute;
                  background:rgba(255,255,255,0.15);border-radius:8px;">
        <div class="f-num" style="top:calc(50% - 50%e); left:calc(50% - 50%e); font-size: 20px;">START</div>
      </div>
    </div>

    <!-- Separator -->
    <div class="cm-mid p-hc" style="top:68%;width:70%;height:1px;opacity:0.4"></div>

    <!-- Project stats (labels + values hidden in free mode via script) -->
    <div class="cm-mid" style="top:calc(72% - 50%e); left:calc(28% - 50%e); font-size: 9px;">
      <eval input="/Zapp/{zapp_index}/Output/climbMode" outputFormat="script x => x ? 'TRIES' : ''" />
    </div>
    <div class="f-num" style="top:calc(77% - 50%e); left:calc(28% - 50%e); font-size: 16px;">
      <eval input="/Zapp/{zapp_index}/Output/projTries" outputFormat="script x => x >= 0 ? x : ''" />
    </div>

    <div class="cm-mid" style="top:calc(72% - 50%e); left:calc(50% - 50%e); font-size: 9px;">
      <eval input="/Zapp/{zapp_index}/Output/climbMode" outputFormat="script x => x ? 'SENDS' : ''" />
    </div>
    <div class="f-num" style="top:calc(77% - 50%e); left:calc(50% - 50%e); font-size: 16px;">
      <eval input="/Zapp/{zapp_index}/Output/projSends" outputFormat="script x => x >= 0 ? x : ''" />
    </div>

    <div class="cm-mid" style="top:calc(72% - 50%e); left:calc(72% - 50%e); font-size: 9px;">
      <eval input="/Zapp/{zapp_index}/Output/climbMode" outputFormat="script x => x ? 'BEST' : ''" />
    </div>
    <div class="f-num" style="top:calc(77% - 50%e); left:calc(72% - 50%e); font-size: 14px;">
      <eval input="/Zapp/{zapp_index}/Output/projBest" outputFormat="script x => x >= 0 ? (Math.floor(x/60) + ':' + ('0' + (x%60)).slice(-2)) : ''" />
    </div>

    <!-- Session time -->
    <div class="cm-mid p-hc" style="top:calc(84% - 50%e); font-size: 10px;">SESSION</div>
    <div class="f-num p-hc" style="top:calc(89% - 50%e); font-size: 14px;">
      <eval input="/Zapp/{zapp_index}/Output/sessionTime" outputFormat="Duration_FourdigitsFixed" default="0:00" />
    </div>

    <!-- Button hints -->
    <:if test="{{ IS_NG3 }}">
      <div class="btn btn-top">
        <img class="cm-bgc icon" src="hint-btn-top.png" />
      </div>
      <div class="btn btn-btm">
        <img class="cm-bgc icon" src="hint-btn-bottom.png" />
      </div>
    </:if>

    <!-- Physical: up=grade up, up long=grade down, down=START, down long=cycle mode -->
    <:if test="{{ HAS_ON_EVENT }}">
    <userInput>
      <pushButton name="up"
        onClick="$.put('/Zapp/{zapp_index}/Event', 1, null, 'int32');"
        onLongPressStart="$.put('/Zapp/{zapp_index}/Event', 2, null, 'int32');" />
      <pushButton name="down"
        onClick="$.put('/Zapp/{zapp_index}/Event', 3, null, 'int32');"
        onLongPressStart="$.put('/Zapp/{zapp_index}/Event', 5, null, 'int32');" />
    </userInput>
    </:if>

  </div>
</uiView>
