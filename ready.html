<uiView onFlickUp="$.put('/Zapp/{zapp_index}/Event', 7, null, 'int32');"
        onFlickDown="$.put('/Zapp/{zapp_index}/Event', 8, null, 'int32');"
        onLoad="
          var G='3a,3a+,3b,3b+,3c,3c+,4a,4a+,4b,4b+,4c,4c+,5a,5a+,5b,5b+,5c,5c+,6a,6a+,6b,6b+,6c,6c+,7a,7a+,7b,7b+,7c,7c+,8a,8a+,8b,8b+,8c,8c+,9a,9a+,9b,9b+,9c|4,4+,5-,5,5+,6-,6,6+,7-,7,7+,8-,8,8+,9-,9,9+,10-,10,10+,11-,11,11+,12-|5.5,5.6,5.7,5.8,5.9,5.10a,5.10b,5.10c,5.10d,5.11a,5.11b,5.11c,5.11d,5.12a,5.12b,5.12c,5.12d,5.13a,5.13b,5.13c,5.13d,5.14a,5.14b,5.14c,5.14d,5.15a,5.15b,5.15c,5.15d|4a,4b,4c,5a,5b,5c,6a,6b,6c,7a,7b|VB,V0,V1,V2,V3,V4,V5,V6,V7,V8,V9,V10,V11,V12|4A,4A+,4B,4B+,4C,4C+,5A,5A+,5B,5B+,5C,5C+,6A,6A+,6B,6B+,6C,6C+,7A,7A+,7B,7B+,7C,7C+,8A,8A+,8B,8B+,8C,8C+|WI2,WI3,WI3+,WI4,WI4+,WI5,WI5+,WI6,WI6+,WI7,WI7+|M1,M2,M3,M4,M5,M6,M7,M8,M9,M10,M11,M12|Set|Lap'.split('|');
          function dG(x){return x>=0?(x%100>=50?'OFF':(G[Math.floor(x/100)]||'').split(',')[x%100]||'?'):'--'}
          var ps=localStorage.getObject('climbProjStats')||{};
          var ws=localStorage.getObject('watchSetup')||{};
          var cSys=ws.sys||0;
          function fT(s){if(s<=0)return '--';var m=Math.floor(s/60),sec=Math.floor(s%60);return m+':'+(sec<10?'0':'')+sec}
          function uP(cm){
            var show=false;
            if(cm>0){
              var w=localStorage.getObject('watchSetup');
              cSys=(w&&w.sys)||0;
              var pgi=w&&w.proj&&w.proj[cSys];
              if(pgi&&pgi[cm-1]>=0){
                show=true;
                var p=ps[cSys+'_'+cm]||{attempts:0,sends:0,bestTime:0};
                setText('#pT',''+p.attempts);
                setText('#pS',''+p.sends);
                setText('#pB',fT(p.bestTime));
              }
            }
            setStyle('#projStats','visibility',show?'VISIBLE':'HIDDEN');
          }
          function uG(v){
            var off=v>=0&&(v%100>=50);
            var pv=off?'VISIBLE':'HIDDEN';
            var ev=off?'HIDDEN':'VISIBLE';
            setStyle('#ph1','visibility',pv);
            setStyle('#ph2','visibility',pv);
            setStyle('#ph3','visibility',pv);
            setStyle('#title','visibility',ev);
            setStyle('#grade','visibility',ev);
            setStyle('#upArr','visibility',ev);
            setStyle('#downArr','visibility',ev);
            if(off)setStyle('#projStats','visibility','HIDDEN');
          }
          $.subscribe('/Zapp/{zapp_index}/Output/climbMode',function(v){uP(v)});
          $.subscribe('/Zapp/{zapp_index}/Output/grade',function(v){uG(v)});
        ">
  <div id="climblogger">

    <!-- Title bar -->
    <div id="title" class="cm-fg" style="width:100%;height:16%"
         onTap="$.put('/Zapp/{zapp_index}/Event', 5, null, 'int32');">
      <div class="sp-t-s" style="top:calc(50% - 50%e); left:calc(50% - 50%e);">
        <eval input="/Zapp/{zapp_index}/Output/modeSub" outputFormat="script x => { if(x>0)return 'ROUTE '+x; var ws=localStorage.getObject('watchSetup'); var sys=ws?(ws.sys|0):0; var sv=localStorage.getObject('stats')||{}; var nms=(sv['projNames'+sys]||'').split(','); var nm=nms[Math.abs(x)-1]; var t=nm?nm.replace(/^\s+|\s+$/g,''):''; return t?t:'PROJECT '+Math.abs(x); }" default="ROUTE 1" />
      </div>
    </div>

    <!-- Up-arrow tap-bar (invisible wide target) -->
    <div onTap="$.put('/Zapp/{zapp_index}/Event', 1, null, 'int32');"
      style="top:17%;left:0;width:70%;height:22%;position:absolute;"></div>
    <!-- Up-arrow icon (screen-centered) -->
    <div id="upArr" class="f-ico p-hc" style="top:calc(36% - 50%e);">&#xF266;</div>

    <!-- Grade display (hero, centered) -->
    <div id="grade" class="sp-t-l" style="top:calc(48% - 50%e); left:calc(50% - 50%e);">
      <eval input="/Zapp/{zapp_index}/Output/grade" outputFormat="script x => dG(x)" default="--" />
    </div>

    <!-- Down-arrow tap-bar (invisible wide target) -->
    <div onTap="$.put('/Zapp/{zapp_index}/Event', 2, null, 'int32');"
      style="top:57%;left:0;width:70%;height:25%;position:absolute;"></div>
    <!-- Down-arrow icon (screen-centered) -->
    <div id="downArr" class="f-ico p-hc" style="top:calc(66% - 50%e);">&#xF267;</div>

    <!-- Placeholder lines (visible only when no project configured in project mode) -->
    <div id="ph1" class="p-hc sp-vertical-center" style="top:calc(30% - 50%e);visibility:HIDDEN">
      <span class="sp-b-s">No project</span>
    </div>
    <div id="ph2" class="p-hc sp-vertical-center" style="top:calc(45% - 50%e);visibility:HIDDEN">
      <span class="sp-b-s">Configure in app</span>
    </div>
    <div id="ph3" class="p-hc sp-vertical-center" style="top:calc(60% - 50%e);visibility:HIDDEN">
      <span class="sp-b-s">or top-long press</span>
    </div>

    <!-- Up-button: visible pill (fixed size). -->
    <div id="pillTop" style="top:18%;left:83%;width:15%;height:12%;position:absolute;">
      <div style="top:0; left:0; width:100%;height:100%;position:absolute;
                  background:rgba(255,255,255,0.15);
                  border-radius:40% 0 0 40%;">
        <div class="f-ico cm-bgc"
             style="top:calc(65% - 50%e); left:6px;">&#xE338;</div>
      </div>
    </div>
    <!-- Up-button: large invisible tap zone (tap = → STATS). -->
    <div id="zoneTop" onTap="$.put('/Zapp/{zapp_index}/Event', 5, null, 'int32');"
      style="top:11%;left:70%;width:30%;height:25%;position:absolute;"></div>

    <!-- Middle-button: visible pill. -->
    <div style="top:44%;left:90%;width:10%;height:12%;position:absolute;">
      <div style="top:0; left:0; width:100%;height:100%;position:absolute;
                  background:rgba(255,255,255,0.15);
                  border-radius:40% 0 0 40%;">
        <div class="f-ico cm-bgc"
             style="top:calc(55% - 50%e); left:6px;">&#xF111;</div>
      </div>
    </div>
    <!-- Middle-button: invisible tap zone -->
    <div onTap="$.put('/Zapp/{zapp_index}/Event', 4, null, 'int32');"
      style="top:37%;left:70%;width:30%;height:25%;position:absolute;"></div>

    <!-- Down-button: visible pill (fixed size). -->
    <div style="top:70%;left:83%;width:15%;height:12%;position:absolute;">
      <div style="top:0; left:0; width:100%;height:100%;position:absolute;
                  background:rgba(255,255,255,0.15);
                  border-radius:40% 0 0 40%;">
        <div class="f-ico cm-bgc"
             style="top:calc(45% - 50%e); left:6px;">&#xE373;</div>
      </div>
    </div>
    <!-- Down-button: large invisible tap zone (tap = START). -->
    <div onTap="$.put('/Zapp/{zapp_index}/Event', 6, null, 'int32'); $.put('/Activity/Trigger', 23);"
      style="top:63%;left:70%;width:30%;height:25%;position:absolute;"></div>

    <!-- Project stats row (only in project mode) -->
    <div id="projStats" class="p-hc sp-vertical-center" style="top:calc(76% - 50%e);visibility:HIDDEN">
      <span class="sp-b-s">T</span>
      <span id="pT" class="sp-b-s f-num" style="padding-left:3px">0</span>
      <span class="sp-b-s" style="padding-left:10px">S</span>
      <span id="pS" class="sp-b-s f-num" style="padding-left:3px">0</span>
      <span class="sp-b-s" style="padding-left:10px">B</span>
      <span id="pB" class="sp-b-s f-num" style="padding-left:3px">--</span>
    </div>

    <!-- Session time -->
    <div class="p-hc sp-vertical-center" style="top:calc(90% - 50%e);">
      <span class="sp-b-s">SES</span>
      <span class="f-ico" style="padding-left:3px;padding-right:3px">&#xF100;</span>
      <span class="sp-b-s f-num"><eval input="/Activity/Move/-1/Duration/Current" outputFormat="Duration_FourdigitsFixed" default="0:00" /></span>
    </div>

    <!-- Physical: up=grade±, up-long=EDIT, mid-long=toggle mode, down±, down-long=START -->
    <:if test="{{ HAS_ON_EVENT }}">
    <userInput>
      <pushButton name="up" type="lock" longType="lock"
        onClick="$.put('/Zapp/{zapp_index}/Event', 1, null, 'int32');"
        onLongPressStart="$.put('/Zapp/{zapp_index}/Event', 5, null, 'int32');" />
      <pushButton name="next" longType="lock"
        onLongPressStart="$.put('/Zapp/{zapp_index}/Event', 4, null, 'int32');" />
      <pushButton name="down" type="lock" longType="lock"
        onClick="$.put('/Zapp/{zapp_index}/Event', 2, null, 'int32');"
        onLongPressStart="$.put('/Zapp/{zapp_index}/Event', 6, null, 'int32'); $.put('/Activity/Trigger', 23);" />
    </userInput>
    </:if>

  </div>
</uiView>
