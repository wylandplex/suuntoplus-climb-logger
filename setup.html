<uiView onFlickUp="ev(7)"
        onFlickDown="ev(8)"
        onLoad="
          var SN='French Sport,UIAA Sport,YDS Sport,British Trad,V-Scale,Font Boulder,Ice (WI),Mixed (M),Hangboard,Scrambling'.split(',');
          function dG(x){if(x<0)return'--';var s=Math.floor(x/100),i=x%100;if(i>=50)return'OFF';if(s===0)return(3+Math.floor(i/6))+'abc'.charAt(Math.floor(i/2)%3)+(i%2?'+':'');if(s===1){var u=(i-2)%3;return i<2?'4'+(i?'+':''):''+(5+Math.floor((i-2)/3))+(u===0?'-':u===2?'+':'');}if(s===2)return i<5?'5.'+(i+5):'5.'+(10+Math.floor((i-5)/4))+'abcd'.charAt((i-5)%4);if(s===3)return(4+Math.floor(i/3))+'abc'.charAt(i%3);if(s===4)return i?'V'+(i-1):'VB';if(s===5)return(4+Math.floor(i/6))+'ABC'.charAt(Math.floor(i/2)%3)+(i%2?'+':'');if(s===6)return'WI'+(i?3+Math.floor((i-1)/2):2)+(i&&(i-1)%2?'+':'');if(s===7)return'M'+(i+1);return s===8?'Set':'Lap';}
          function sN(x){return SN[x]||'?'}
          var lock=0;
          function ev(n){$.put('/Zapp/{zapp_index}/Event',n,null,'int32')}
          function ulk(){lock=0}
          function evX(n){if(lock)return;ev(n);lock=1;setTimeout(ulk,300)}
        ">
  <div id="climblogger">

    <!-- SETUP as its own template (split out of manage.html): mounting SETUP no longer builds the
         hidden PROJ-SETUP section too — ~half the old manage mount. Single-state: no vState/applyVis. -->

    <div id="sc4" style="position:absolute;top:0;left:0;width:100%;height:100%;visibility:VISIBLE">

      <div class="f-ico p-hc" style="top:calc(22% - 18.5px);">&#xF102;</div>

      <div onTap="ev(1)" style="top:17%;left:0;width:70%;height:22%;position:absolute;"></div>
      <div class="f-ico p-hc" style="top:calc(33% - 18.5px);">&#xF266;</div>

      <div class="sp-t-l" style="top:calc(42% - 50%e); left:calc(50% - 50%e);">
        <eval input="/Zapp/{zapp_index}/Output/modeSub" outputFormat="script x => sN(x)" default="?" />
      </div>
      <div class="sp-t-l" style="top:calc(59% - 36.5px); left:calc(50% - 50%e);">
        <eval input="/Zapp/{zapp_index}/Output/packedGL" outputFormat="script x => dG(Math.floor(x/952))" default="--" />
      </div>

      <div onTap="ev(2)" style="top:57%;left:0;width:70%;height:25%;position:absolute;"></div>
      <div class="f-ico p-hc" style="top:calc(74% - 18.5px);">&#xF267;</div>

      <!-- Bottom pill (save) — DOWN-long = save&exit on setup -->
      <div style="top:70%;left:83%;width:15%;height:12%;position:absolute;background:rgba(255,255,255,0.15);">
        <div class="f-ico cm-bgc" style="top:calc(50% - 18.5px); left:6px;">&#xE373;</div>
      </div>
      <div onTap="evX(6)" style="top:63%;left:70%;width:30%;height:25%;position:absolute;"></div>

    </div>


    <!-- No bottom time-bar on SETUP: pre-activity there is nothing to time (duration is 0:00), so the
         clock+duration wrapper and its two eval subscriptions are omitted here — a lighter setup mount
         (the template the watch builds on every enable/re-enable). The time-bar lives on ready/active. -->

    <!-- Physical pushButtons — universal events, main.js dispatches by state -->
    <:if test="{{ HAS_ON_EVENT }}">
    <userInput>
      <!-- onLongPressFull=";" consumes the firmware up=Multisport / down=Control-Panel long-press default.
           The SETUP→active SCREEN-JUMP (the unload+remount IS the co-app evict, confirmed on-watch) is
           mitigated by the active.html mount diet — a lighter remount peak, NOT input deferral. (An earlier
           pendBack "defer goState(0) one tick" attempt was tried and reverted.) 'next' stays free (middle = screen nav). -->
      <pushButton name="up" type="lock" longType="lock"
        onClick="ev(1)"
        onLongPressStart="evX(5)"
        onLongPressFull=";" />
      <pushButton name="next" longType="lock"
        onLongPressStart="ev(4)" />
      <pushButton name="down" type="lock" longType="lock"
        onClick="ev(2)"
        onLongPressStart="evX(6)"
        onLongPressFull=";" />
    </userInput>
    </:if>

  </div>
</uiView>
