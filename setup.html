<uiView onLoad="
          var M=Math.floor,SN='French Sport,UIAA Sport,YDS Sport,British Trad,V-Scale,Font Boulder,Ice (WI),Mixed (M),Hangboard,Scrambling'.split(',');
          // SETUP only ever previews the DEFAULT grade of the selected system (main.js state-4 sets
          // gradeV=encGrade(DEFAULT_IDX[gradeSystem])), so the 10 samples are precomputed here as a flat
          // table instead of shipping the full dG() grade algorithm — same strings, a fraction of the mount.
          var GS='6a,6,5.10a,5c,V3,6A,WI4,M6,Set,Lap'.split(',');
          function sN(x){return SN[x]||'?'}
          var lock=0;
          function ev(n){$.put('/Zapp/{zapp_index}/Event',n,null,'int32')}
          function ulk(){lock=0}
          function evX(n){if(lock)return;ev(n);lock=1;setTimeout(ulk,300)}
          setStyle('#ht','TRANSFORMCONTENT',transformation().rotate(.5));
          ev(9);
        ">
  <div>

    <!-- Shared shaped header backing. Keep it first so setup controls always paint above it. -->
    <div id="ht" style="position:absolute;top:0;left:0;width:100%;height:24%">
      <img src="tooth.png" class="p-hc" style="top:calc(100% - 100%e);color:#4a4d56" />
    </div>
    <div class="sp-b-s p-hc" style="top:calc(18% - 50%e)">
      <span class="f-num"><eval input="/Dev/Time/LocalTime" outputFormat="script x => ('0'+M((x/3600)%24)).slice(-2)+':'+('0'+M((x/60)%60)).slice(-2)" default="--:--" /></span>
      <span class="f-ico" style="padding-left:6px;padding-right:6px">&#xF100;</span>
      <span class="f-num"><eval input="/Activity/Move/-1/Duration/Current" outputFormat="Duration_FourdigitsFixed" default="0:00" /></span>
    </div>

    <!-- SETUP as its own template (split out of manage.html): mounting SETUP no longer builds the
         hidden PROJ-SETUP section too — ~half the old manage mount. Single-state: no vState/applyVis. -->

    <!-- Audit U4: the dead #sc4 full-screen wrapper is gone — children sit in the identical root frame. -->
      <div onTap="ev(1)" style="top:29%;left:0;width:70%;height:17%;position:absolute;"></div>
      <div class="f-ico p-hc" style="top:calc(38% - 20px);">&#xF266;</div>

      <div class="sp-t-l p-hc p-tc" style="top:calc(50% - 50%e);width:100%">
        <eval input="/Zapp/{zapp_index}/Output/modeSub" outputFormat="script x => (setText('#sg',GS[x]||'--'),sN(x))" default="?" />
      </div>
      <div id="sg" class="sp-t-l p-hc p-tc" style="top:calc(63% - 50%e);width:100%">--</div>

      <div onTap="ev(2)" style="top:68%;left:0;width:70%;height:19%;position:absolute;"></div>
      <div class="f-ico p-hc" style="top:calc(76% - 18.5px);">&#xF267;</div>

      <!-- Bottom pill (save) — DOWN-long = save&exit on setup -->
      <div class="f-ico cm-bgc" style="top:calc(76% - 18.5px);left:calc(85% - 50%e);">&#xE373;</div>
      <div onTap="evX(6)" style="top:63%;left:70%;width:30%;height:25%;position:absolute;"></div>

    <!-- Session duration and clock share the shaped header, matching READY/ACTIVE. -->

    <import src="#zone-g" />
    <!-- Audit U5: bare side-effect eval, no 0x0 holder box — the bare pattern is on-watch proven (ready.html) -->
    <eval input="/Activity/Zones/HeartRate/Position" outputFormat="script x => ((typeof x==='number'&amp;&amp;isFinite(x)&amp;&amp;x&gt;0&amp;&amp;x&lt;1)?(setVis('#z-ind',1),gaugeControl('#z-ind',x*2*Math.PI,'radian')):setVis('#z-ind',0),'')" default="" />

    <!-- Physical pushButtons — universal events, main.js dispatches by state -->
    <:if test="{{ HAS_ON_EVENT }}">
    <userInput>
      <!-- onLongPressFull=";" consumes the firmware up=Multisport / down=Control-Panel long-press default.
           The SETUP→active SCREEN-JUMP (the unload+remount IS the co-app evict, confirmed on-watch) is
           mitigated by the active.html mount diet — a lighter remount peak, NOT input deferral. (An earlier
           pendBack "defer goState(0) one tick" attempt was tried and reverted.) 'next' stays free (middle = screen nav). -->
      <pushButton name="up" type="lock" longType="lock"
        onClick="ev(1)"
        onLongPressStart="evX(5)"
        onLongPressFull=";" />
      <pushButton name="next" longType="lock"
        onLongPressStart="ev(4)" />
      <pushButton name="down" type="lock" longType="lock"
        onClick="ev(2)"
        onLongPressStart="evX(6)"
        onLongPressFull=";" />
    </userInput>
    </:if>

  </div>
</uiView>
