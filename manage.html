<uiView onFlickUp="ev(7)"
        onFlickDown="ev(8)"
        onLoad="
          var G='3a,3a+,3b,3b+,3c,3c+,4a,4a+,4b,4b+,4c,4c+,5a,5a+,5b,5b+,5c,5c+,6a,6a+,6b,6b+,6c,6c+,7a,7a+,7b,7b+,7c,7c+,8a,8a+,8b,8b+,8c,8c+,9a,9a+,9b,9b+,9c|4,4+,5-,5,5+,6-,6,6+,7-,7,7+,8-,8,8+,9-,9,9+,10-,10,10+,11-,11,11+,12-|5.5,5.6,5.7,5.8,5.9,5.10a,5.10b,5.10c,5.10d,5.11a,5.11b,5.11c,5.11d,5.12a,5.12b,5.12c,5.12d,5.13a,5.13b,5.13c,5.13d,5.14a,5.14b,5.14c,5.14d,5.15a,5.15b,5.15c,5.15d|4a,4b,4c,5a,5b,5c,6a,6b,6c,7a,7b|VB,V0,V1,V2,V3,V4,V5,V6,V7,V8,V9,V10,V11,V12|4A,4A+,4B,4B+,4C,4C+,5A,5A+,5B,5B+,5C,5C+,6A,6A+,6B,6B+,6C,6C+,7A,7A+,7B,7B+,7C,7C+,8A,8A+,8B,8B+,8C,8C+|WI2,WI3,WI3+,WI4,WI4+,WI5,WI5+,WI6,WI6+,WI7,WI7+|M1,M2,M3,M4,M5,M6,M7,M8,M9,M10,M11,M12|Set|Lap'.split('|');
          var SN='French Sport,UIAA Sport,YDS Sport,British Trad,V-Scale,Font Boulder,Ice (WI),Mixed (M),Hangboard,Scrambling'.split(',');
          var Gs=null,Gsi=-1;
          function dG(x){if(x<0)return'--';if(x%100>=50)return'OFF';var si=Math.floor(x/100);if(si!==Gsi){Gs=(G[si]||'').split(',');Gsi=si}return(Gs||[])[x%100]||'?'}
          function sN(x){return SN[x]||'?'}
          var lapState=4,lock=0,visState=-1;
          function applyVis(x){
            if(x===visState)return;
            visState=x;lapState=x;
            setStyle('#sc4','visibility',x===4?'VISIBLE':'HIDDEN');
            setStyle('#sc6','visibility',x===6?'VISIBLE':'HIDDEN');
          }
          function ev(n){$.put('/Zapp/{zapp_index}/Event',n,null,'int32')}
          function lap(){$.put('/Activity/Trigger',23)}
          function ulk(){lock=0}
          function evX(n){if(lock)return;ev(n);lock=1;setTimeout(ulk,300)}
          function evL(n){if(lock)return;var s=lapState;if((n===6&&s===0)||s===1)lap();ev(n);lock=1;setTimeout(ulk,300)}
        ">
  <div id="climblogger">


    <!-- vState → applyVis: <eval> binding replaces leaky $.subscribe (#90). Eval bindings are framework-managed, do not leak on template unload. -->
    <!-- SuuntoPlus CSS parser rejects display:none → use visibility:HIDDEN + 0-dim instead. -->
    <div style="position:absolute;top:0;left:0;width:0;height:0;visibility:HIDDEN"><eval input="/Zapp/{zapp_index}/Output/vState" outputFormat="script x => (applyVis(x),'')" default="" /></div>

    <div id="sc4" style="position:absolute;top:0;left:0;width:100%;height:100%;visibility:VISIBLE">

      <div class="f-ico p-hc" style="top:calc(22% - 50%e);">&#xF102;</div>

      <div onTap="ev(1)" style="top:17%;left:0;width:70%;height:22%;position:absolute;"></div>
      <div class="f-ico p-hc" style="top:calc(33% - 50%e);">&#xF266;</div>

      <div class="sp-t-l" style="top:calc(42% - 50%e); left:calc(50% - 50%e);">
        <eval input="/Zapp/{zapp_index}/Output/modeSub" outputFormat="script x => sN(x)" default="?" />
      </div>
      <div class="sp-t-l" style="top:calc(59% - 50%e); left:calc(50% - 50%e);">
        <eval input="/Zapp/{zapp_index}/Output/grade" outputFormat="script x => dG(x)" default="--" />
      </div>

      <div onTap="ev(2)" style="top:57%;left:0;width:70%;height:25%;position:absolute;"></div>
      <div class="f-ico p-hc" style="top:calc(74% - 50%e);">&#xF267;</div>

      <!-- Bottom pill (save) — DOWN-long = save&exit on setup -->
      <div style="top:70%;left:83%;width:15%;height:12%;position:absolute;background:rgba(255,255,255,0.15);border-radius:50px 0 0 50px;">
        <div class="f-ico cm-bgc" style="top:calc(50% - 50%e); left:6px;">&#xE373;</div>
      </div>
      <div onTap="evX(6)" style="top:63%;left:70%;width:30%;height:25%;position:absolute;"></div>

    </div>

    <!-- EDIT (sc5) lives in its own template now (edit.html) — mounting manage.xml for SETUP/
         proj-setup no longer carries the EDIT section, and EDIT entry mounts ~7KB instead. -->

    <div id="sc6" style="position:absolute;top:0;left:0;width:100%;height:100%;visibility:HIDDEN">

      <div class="sp-b-s p-hc" style="top:calc(22% - 50%e);">
        <span>PROJECT </span>
        <span class="f-num"><eval input="/Zapp/{zapp_index}/Output/modeSub" outputFormat="Count_Twodigits" default="1" /></span>
      </div>

      <div onTap="ev(1)" style="top:17%;left:0;width:70%;height:22%;position:absolute;"></div>
      <div class="f-ico p-hc" style="top:calc(36% - 50%e);">&#xF266;</div>

      <div class="sp-t-l" style="top:calc(48% - 50%e); left:calc(50% - 50%e);">
        <eval input="/Zapp/{zapp_index}/Output/grade" outputFormat="script x => dG(x)" default="OFF" />
      </div>

      <div onTap="ev(2)" style="top:57%;left:0;width:70%;height:25%;position:absolute;"></div>
      <div class="f-ico p-hc" style="top:calc(66% - 50%e);">&#xF267;</div>

      <!-- Top pill (save & back to ready) — UP-long = save & back -->
      <div style="top:18%;left:83%;width:15%;height:12%;position:absolute;background:rgba(255,255,255,0.15);border-radius:50px 0 0 50px;">
        <div class="f-ico cm-bgc" style="top:calc(50% - 50%e); left:6px;">&#xE365;</div>
      </div>
      <div onTap="evX(5)" style="top:11%;left:70%;width:30%;height:25%;position:absolute;"></div>

      <!-- Bottom pill (save & next slot) — DOWN-long = save & weiter -->
      <div style="top:70%;left:83%;width:15%;height:12%;position:absolute;background:rgba(255,255,255,0.15);border-radius:50px 0 0 50px;">
        <div class="f-ico cm-bgc" style="top:calc(50% - 50%e); left:6px;">&#xE373;</div>
      </div>
      <div onTap="ev(6)" style="top:63%;left:70%;width:30%;height:25%;position:absolute;"></div>

    </div>

    <!-- Time-bar + rhombus removed from manage screens (template diet): saves the rhombus div +
         6 elements + 2 eval bindings off the manage mount; active.html keeps its copy, so the
         LocalTime/Duration paths stay subscribed (no LID change). -->

    <!-- Physical pushButtons — universal events, main.js dispatches by state -->
    <:if test="{{ HAS_ON_EVENT }}">
    <userInput>
      <pushButton name="up" type="lock" longType="lock"
        onClick="ev(1)"
        onLongPressStart="evL(5)" />
      <pushButton name="next" longType="lock"
        onLongPressStart="ev(4)" />
      <pushButton name="down" type="lock" longType="lock"
        onClick="ev(2)"
        onLongPressStart="evL(6)" />
    </userInput>
    </:if>

  </div>
</uiView>
