<uiView>
  <div>
    <!-- Minimal pause/save screen. ZERO onLoad, ZERO G table, ZERO eval bindings — mounted at onExercisePause
         so unloading the heavy active.html frees its ~1.3-2KB G-table + DOM + evals BEFORE the onExerciseEnd
         ext-parse save burst (pause always runs before End), giving the GC max time to reclaim it.
         Audit U4: the dead #sc7 full-screen wrapper + the unused climblogger id are gone — the root
         div provides the identical frame; ALL siblings build at mount, every box costs. -->
    <div class="sp-t-l p-hc" style="top:calc(40% - 50%e);">PAUSE</div>
    <import src="#zone-g" />
    <:if test="{{ HAS_ON_EVENT }}">
    <userInput>
      <pushButton name="up" type="lock" longType="lock" onLongPressFull=";" />
      <pushButton name="next" longType="lock" />
      <pushButton name="down" type="lock" longType="lock" onLongPressFull=";" />
    </userInput>
    </:if>
  </div>
</uiView>
