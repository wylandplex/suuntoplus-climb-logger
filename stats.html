<uiView onLoad="
          var G='3a,3a+,3b,3b+,3c,3c+,4a,4a+,4b,4b+,4c,4c+,5a,5a+,5b,5b+,5c,5c+,6a,6a+,6b,6b+,6c,6c+,7a,7a+,7b,7b+,7c,7c+,8a,8a+,8b,8b+,8c,8c+,9a,9a+,9b,9b+,9c|4,4+,5-,5,5+,6-,6,6+,7-,7,7+,8-,8,8+,9-,9,9+,10-,10,10+,11-,11,11+,12-|5.5,5.6,5.7,5.8,5.9,5.10a,5.10b,5.10c,5.10d,5.11a,5.11b,5.11c,5.11d,5.12a,5.12b,5.12c,5.12d,5.13a,5.13b,5.13c,5.13d,5.14a,5.14b,5.14c,5.14d,5.15a,5.15b,5.15c,5.15d|4a,4b,4c,5a,5b,5c,6a,6b,6c,7a,7b|WI2,WI3,WI3+,WI4,WI4+,WI5,WI5+,WI6,WI6+,WI7,WI7+|M1,M2,M3,M4,M5,M6,M7,M8,M9,M10,M11,M12|VB,V0,V1,V2,V3,V4,V5,V6,V7,V8,V9,V10,V11,V12|4A,4A+,4B,4B+,4C,4C+,5A,5A+,5B,5B+,5C,5C+,6A,6A+,6B,6B+,6C,6C+,7A,7A+,7B,7B+,7C,7C+,8A,8A+,8B,8B+,8C,8C+'.split('|');
          var LENS=[41,24,29,11,11,12,14,30];
          var PAGES=['VOLUME','HEART RATE','CLIMBED','TOP 10'];
          function dG(x){return x>=0?(x%100>=50?'OFF':(G[Math.floor(x/100)]||'').split(',')[x%100]||'?'):'--'}
          var sv=localStorage.getObject('stats')||{};
          setText('#s_r',''+(sv.totalRoutes||0));
          setText('#s_sn',''+(sv.totalSends||0));
          setText('#s_pc',''+(sv.sendPct||0));
          setText('#s_se',''+(sv.sessions||0));
          setText('#s_hr',''+(sv.avgHr||0));
          setText('#s_mx',''+(sv.avgMaxHr||0));
          setText('#s_hrr',''+(sv.avgHrr||0));
          setText('#s_th',''+(sv.totalHeight||0));
          setText('#s_pk',sv.peakGrade>=0?dG(sv.peakGrade):'--');
          var ps=localStorage.getObject('climbProjStats')||{};
          var es=[];
          for(var ky in ps) if(ps[ky].sends>0) es.push({k:ky,p:ps[ky]});
          es.sort(function(a,b){
            var ka=+a.k.split('_')[0], kb=+b.k.split('_')[0];
            var na=(a.p.g||0)/(LENS[ka]-1), nb=(b.p.g||0)/(LENS[kb]-1);
            if(na!==nb) return nb-na;
            return (b.p.sends||0)-(a.p.sends||0);
          });
          for(var i=0;i<10;i++){
            var e=es[i];
            if(e){
              var kp=e.k.split('_');
              setText('#r'+(i+1)+'_g', dG((+kp[0])*100+(e.p.g||0)));
              setText('#r'+(i+1)+'_c', e.p.attempts+'/'+e.p.sends);
            } else {
              setText('#r'+(i+1)+'_g', '');
              setText('#r'+(i+1)+'_c', '');
            }
          }
        ">
  <div id="climblogger">

    <!-- Pannable page stack (native SDK primitive) -->
    <uiViewSet id="vs" orientation="vertical" rollOver="none"
               transition.type="slide" transition.timing="ease" transition.duration="0.25"
               onSelectionChanged="setText('#pageLabel', PAGES[targetData])"
               style="position:absolute;top:16%;left:0;width:100%;height:84%">

      <!-- Page 1: Volume -->
      <div class="selected">
        <div class="p-hc sp-vertical-center" style="top:calc(20% - 50%e);"><span class="sp-b-s">Routes</span><span id="s_r" class="sp-b-m f-num" style="padding-left:6px">--</span></div>
        <div class="p-hc sp-vertical-center" style="top:calc(42% - 50%e);"><span class="sp-b-s">Sends</span><span id="s_sn" class="sp-b-m f-num" style="padding-left:6px">--</span></div>
        <div class="p-hc sp-vertical-center" style="top:calc(64% - 50%e);"><span class="sp-b-s">Rate %</span><span id="s_pc" class="sp-b-m f-num" style="padding-left:6px">--</span></div>
        <div class="p-hc sp-vertical-center" style="top:calc(86% - 50%e);"><span class="sp-b-s">Sessions</span><span id="s_se" class="sp-b-m f-num" style="padding-left:6px">--</span></div>
      </div>

      <!-- Page 2: Heart rate -->
      <div>
        <div class="p-hc sp-vertical-center" style="top:calc(25% - 50%e);"><span class="sp-b-s">Avg HR</span><span id="s_hr" class="sp-b-m f-num" style="padding-left:6px">--</span></div>
        <div class="p-hc sp-vertical-center" style="top:calc(50% - 50%e);"><span class="sp-b-s">Avg Max</span><span id="s_mx" class="sp-b-m f-num" style="padding-left:6px">--</span></div>
        <div class="p-hc sp-vertical-center" style="top:calc(75% - 50%e);"><span class="sp-b-s">Avg HRR</span><span id="s_hrr" class="sp-b-m f-num" style="padding-left:6px">--</span></div>
      </div>

      <!-- Page 3: Climbed -->
      <div>
        <div class="p-hc sp-vertical-center" style="top:calc(35% - 50%e);"><span class="sp-b-s">Total H</span><span id="s_th" class="sp-b-m f-num" style="padding-left:6px">--</span><span class="sp-b-s">m</span></div>
        <div class="p-hc sp-vertical-center" style="top:calc(65% - 50%e);"><span class="sp-b-s">Peak</span><span id="s_pk" class="sp-b-m" style="padding-left:6px">--</span></div>
      </div>

      <!-- Page 4: Top 10 (two columns, centered vertically) -->
      <div>
        <div class="sp-vertical-center" style="top:calc(18% - 50%e); left:calc(30% - 50%e);"><span class="sp-b-s">1.</span><span id="r1_g" class="sp-b-s" style="padding-left:4px"></span><span id="r1_c" class="sp-b-s f-num" style="padding-left:6px"></span></div>
        <div class="sp-vertical-center" style="top:calc(18% - 50%e); left:calc(70% - 50%e);"><span class="sp-b-s">6.</span><span id="r6_g" class="sp-b-s" style="padding-left:4px"></span><span id="r6_c" class="sp-b-s f-num" style="padding-left:6px"></span></div>
        <div class="sp-vertical-center" style="top:calc(34% - 50%e); left:calc(30% - 50%e);"><span class="sp-b-s">2.</span><span id="r2_g" class="sp-b-s" style="padding-left:4px"></span><span id="r2_c" class="sp-b-s f-num" style="padding-left:6px"></span></div>
        <div class="sp-vertical-center" style="top:calc(34% - 50%e); left:calc(70% - 50%e);"><span class="sp-b-s">7.</span><span id="r7_g" class="sp-b-s" style="padding-left:4px"></span><span id="r7_c" class="sp-b-s f-num" style="padding-left:6px"></span></div>
        <div class="sp-vertical-center" style="top:calc(50% - 50%e); left:calc(30% - 50%e);"><span class="sp-b-s">3.</span><span id="r3_g" class="sp-b-s" style="padding-left:4px"></span><span id="r3_c" class="sp-b-s f-num" style="padding-left:6px"></span></div>
        <div class="sp-vertical-center" style="top:calc(50% - 50%e); left:calc(70% - 50%e);"><span class="sp-b-s">8.</span><span id="r8_g" class="sp-b-s" style="padding-left:4px"></span><span id="r8_c" class="sp-b-s f-num" style="padding-left:6px"></span></div>
        <div class="sp-vertical-center" style="top:calc(66% - 50%e); left:calc(30% - 50%e);"><span class="sp-b-s">4.</span><span id="r4_g" class="sp-b-s" style="padding-left:4px"></span><span id="r4_c" class="sp-b-s f-num" style="padding-left:6px"></span></div>
        <div class="sp-vertical-center" style="top:calc(66% - 50%e); left:calc(70% - 50%e);"><span class="sp-b-s">9.</span><span id="r9_g" class="sp-b-s" style="padding-left:4px"></span><span id="r9_c" class="sp-b-s f-num" style="padding-left:6px"></span></div>
        <div class="sp-vertical-center" style="top:calc(82% - 50%e); left:calc(30% - 50%e);"><span class="sp-b-s">5.</span><span id="r5_g" class="sp-b-s" style="padding-left:4px"></span><span id="r5_c" class="sp-b-s f-num" style="padding-left:6px"></span></div>
        <div class="sp-vertical-center" style="top:calc(82% - 50%e); left:calc(70% - 50%e);"><span class="sp-b-s">10.</span><span id="r10_g" class="sp-b-s" style="padding-left:4px"></span><span id="r10_c" class="sp-b-s f-num" style="padding-left:6px"></span></div>
      </div>

    </uiViewSet>

    <!-- Title bar: stats icon + dynamic page label (matches other screens at 16%) -->
    <div class="cm-fg" style="width:100%;height:16%">
      <div class="p-hc sp-vertical-center" style="top:calc(50% - 50%e);">
        <span class="f-ico" style="padding-right:6px">&#xF107;</span>
        <span class="sp-t-s" id="pageLabel">VOLUME</span>
      </div>
    </div>

    <!-- Up-button: visible pill. -->
    <div style="top:18%;left:83%;width:15%;height:12%;position:absolute;">
      <div style="top:0; left:0; width:100%;height:100%;position:absolute;
                  background:rgba(255,255,255,0.15);
                  border-radius:40% 0 0 40%;">
        <div class="f-ico cm-bgc"
             style="top:calc(65% - 50%e); left:6px;">&#xF102;</div>
      </div>
    </div>
    <!-- Up-button: invisible tap zone (tap = → SETUP, consistent with long-press). -->
    <div onTap="$.put('/Zapp/{zapp_index}/Event', 5, null, 'int32');"
      style="top:11%;left:70%;width:30%;height:25%;position:absolute;"></div>

    <!-- Down-button: visible pill (E365 = back/exit). -->
    <div style="top:70%;left:83%;width:15%;height:12%;position:absolute;">
      <div style="top:0; left:0; width:100%;height:100%;position:absolute;
                  background:rgba(255,255,255,0.15);
                  border-radius:40% 0 0 40%;">
        <div class="f-ico cm-bgc"
             style="top:calc(45% - 50%e); left:6px;">&#xE365;</div>
      </div>
    </div>
    <!-- Down-button: invisible tap zone (tap = → READY, consistent with long-press). -->
    <div onTap="$.put('/Zapp/{zapp_index}/Event', 6, null, 'int32');"
      style="top:63%;left:70%;width:30%;height:25%;position:absolute;"></div>

    <!-- Physical: up-short=prev page, down-short=next page, long-press=navigate -->
    <:if test="{{ HAS_ON_EVENT }}">
    <userInput>
      <pushButton name="up" type="lock" longType="lock"
        onClick="previous('vs')"
        onLongPressStart="$.put('/Zapp/{zapp_index}/Event', 5, null, 'int32');" />
      <pushButton name="next" longType="lock"
        onLongPressStart="$.put('/Zapp/{zapp_index}/Event', 4, null, 'int32');" />
      <pushButton name="down" type="lock" longType="lock"
        onClick="next('vs')"
        onLongPressStart="$.put('/Zapp/{zapp_index}/Event', 6, null, 'int32');" />
    </userInput>
    </:if>

  </div>
</uiView>
