<uiView onLoad="
          var G='3a,3a+,3b,3b+,3c,3c+,4a,4a+,4b,4b+,4c,4c+,5a,5a+,5b,5b+,5c,5c+,6a,6a+,6b,6b+,6c,6c+,7a,7a+,7b,7b+,7c,7c+,8a,8a+,8b,8b+,8c,8c+,9a,9a+,9b,9b+,9c|4,4+,5-,5,5+,6-,6,6+,7-,7,7+,8-,8,8+,9-,9,9+,10-,10,10+,11-,11,11+,12-|5.5,5.6,5.7,5.8,5.9,5.10a,5.10b,5.10c,5.10d,5.11a,5.11b,5.11c,5.11d,5.12a,5.12b,5.12c,5.12d,5.13a,5.13b,5.13c,5.13d,5.14a,5.14b,5.14c,5.14d,5.15a,5.15b,5.15c,5.15d|4a,4b,4c,5a,5b,5c,6a,6b,6c,7a,7b|WI2,WI3,WI3+,WI4,WI4+,WI5,WI5+,WI6,WI6+,WI7,WI7+|M1,M2,M3,M4,M5,M6,M7,M8,M9,M10,M11,M12|VB,V0,V1,V2,V3,V4,V5,V6,V7,V8,V9,V10,V11,V12|4A,4A+,4B,4B+,4C,4C+,5A,5A+,5B,5B+,5C,5C+,6A,6A+,6B,6B+,6C,6C+,7A,7A+,7B,7B+,7C,7C+,8A,8A+,8B,8B+,8C,8C+'.split('|');
          function dG(x){return x>=0?(x%100>=50?'OFF':(G[Math.floor(x/100)]||'').split(',')[x%100]||'?'):'--'}
        ">
  <div id="climblogger">

    <!-- Title bar -->
    <div class="cm-fg" style="width:100%;height:16%">
      <div id="title" class="sp-t-s" style="top:calc(50% - 50%e); left:calc(50% - 50%e);">
        <eval input="/Zapp/{zapp_index}/Output/modeSub" outputFormat="script x => x > 0 ? 'ROUTE ' + x : 'PROJECT ' + Math.abs(x)" default="ROUTE 1" />
      </div>
    </div>

    <!-- Route timer (hero) -->
    <div class="sp-d-l p-hc" style="top:calc(30% - 50%e);">
      <eval input="/Activity/Lap/-1/Duration/Current" outputFormat="Duration_FourdigitsFixed" default="0:00" />
    </div>

    <!-- Separator -->
    <div class="p-hc" style="top:44%;width:70%;height:2px;background:rgba(255,255,255,0.3)"></div>

    <!-- Height + Grade side by side (small stats row) -->
    <div class="sp-vertical-center" style="top:calc(55% - 50%e); left:calc(30% - 50%e);">
      <span class="sp-b-s">H</span>
      <span class="sp-b-m f-num" style="padding-left:4px"><eval input="/Zapp/{zapp_index}/Output/routeHeight" outputFormat="script x => (x>=0?'+':'')+x+'m'" default="0m" /></span>
    </div>

    <!-- Vertical separator -->
    <div class="p-hc" style="top:49%;width:2px;height:14%;background:rgba(255,255,255,0.3)"></div>

    <div class="sp-vertical-center" style="top:calc(55% - 50%e); left:calc(70% - 50%e);">
      <span class="f-ico" style="padding-right:4px">&#xF144;</span>
      <span class="sp-b-m"><eval input="/Zapp/{zapp_index}/Output/grade" outputFormat="script x => dG(x)" default="--" /></span>
    </div>

    <!-- HR hero (big, between stats and session). Anchor shifted left to compensate for icon-on-left layout (number otherwise appears right-biased, especially at 3 digits). -->
    <div class="sp-vertical-center" style="top:calc(75% - 50%e); left:calc(45% - 50%e);">
      <span class="f-ico sp-c-red" style="padding-right:6px">&#xF101;</span>
      <span class="sp-d-m"><eval input="/Activity/Move/-1/Heartrate/Current" outputFormat="HeartRate_Fourdigits" default="--" /></span>
    </div>

    <!-- Session time -->
    <div class="p-hc sp-vertical-center" style="top:calc(90% - 50%e);">
      <span class="sp-b-s">SES</span>
      <span class="f-ico" style="padding-left:3px;padding-right:3px">&#xF100;</span>
      <span class="sp-b-s f-num"><eval input="/Activity/Move/-1/Duration/Current" outputFormat="Duration_FourdigitsFixed" default="0:00" /></span>
    </div>

    <!-- Up-button: visible pill (fixed size). -->
    <div style="top:18%;left:83%;width:15%;height:12%;position:absolute;">
      <div style="top:0; left:0; width:100%;height:100%;position:absolute;
                  background:rgba(255,255,255,0.15);
                  border-radius:40% 0 0 40%;">
        <div class="f-ico" style="top:calc(65% - 50%e); left:6px;color:#fff;">&#xF110;</div>
      </div>
    </div>
    <!-- Up-button: large invisible tap zone (tap = FAIL). -->
    <div onTap="$.put('/Activity/Trigger', 23); $.put('/Zapp/{zapp_index}/Event', 5, null, 'int32');"
      style="top:11%;left:70%;width:30%;height:25%;position:absolute;"></div>

    <!-- Down-button: visible pill (fixed size). -->
    <div style="top:70%;left:83%;width:15%;height:12%;position:absolute;">
      <div style="top:0; left:0; width:100%;height:100%;position:absolute;
                  background:rgba(255,255,255,0.15);
                  border-radius:40% 0 0 40%;">
        <div class="f-ico" style="top:calc(45% - 50%e); left:6px;color:#fff;">&#xF200;</div>
      </div>
    </div>
    <!-- Down-button: large invisible tap zone (tap = SEND). -->
    <div onTap="$.put('/Activity/Trigger', 23); $.put('/Zapp/{zapp_index}/Event', 6, null, 'int32');"
      style="top:63%;left:70%;width:30%;height:25%;position:absolute;"></div>

    <!-- Physical: up-long=FAIL+lap, down-long=SEND+lap, mid locked (no OS interrupt) -->
    <:if test="{{ HAS_ON_EVENT }}">
    <userInput>
      <pushButton name="up" type="lock" longType="lock"
        onClick="$.put('/Zapp/{zapp_index}/Event', 0, null, 'int32');"
        onLongPressStart="$.put('/Activity/Trigger', 23); $.put('/Zapp/{zapp_index}/Event', 5, null, 'int32');" />
      <pushButton name="next" type="lock" longType="lock"
        onClick="$.put('/Zapp/{zapp_index}/Event', 0, null, 'int32');"
        onLongPressStart="$.put('/Zapp/{zapp_index}/Event', 0, null, 'int32');" />
      <pushButton name="down" type="lock" longType="lock"
        onClick="$.put('/Zapp/{zapp_index}/Event', 0, null, 'int32');"
        onLongPressStart="$.put('/Activity/Trigger', 23); $.put('/Zapp/{zapp_index}/Event', 6, null, 'int32');" />
    </userInput>
    </:if>

  </div>
</uiView>
