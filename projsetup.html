<uiView onLoad="
  var G='3a,3a+,3b,3b+,3c,3c+,4a,4a+,4b,4b+,4c,4c+,5a,5a+,5b,5b+,5c,5c+,6a,6a+,6b,6b+,6c,6c+,7a,7a+,7b,7b+,7c,7c+,8a,8a+,8b,8b+,8c,8c+,9a,9a+,9b,9b+,9c|4,4+,5-,5,5+,6-,6,6+,7-,7,7+,8-,8,8+,9-,9,9+,10-,10,10+,11-,11,11+,12-|5.5,5.6,5.7,5.8,5.9,5.10a,5.10b,5.10c,5.10d,5.11a,5.11b,5.11c,5.11d,5.12a,5.12b,5.12c,5.12d,5.13a,5.13b,5.13c,5.13d,5.14a,5.14b,5.14c,5.14d,5.15a,5.15b,5.15c,5.15d|4a,4b,4c,5a,5b,5c,6a,6b,6c,7a,7b|VB,V0,V1,V2,V3,V4,V5,V6,V7,V8,V9,V10,V11,V12|4A,4A+,4B,4B+,4C,4C+,5A,5A+,5B,5B+,5C,5C+,6A,6A+,6B,6B+,6C,6C+,7A,7A+,7B,7B+,7C,7C+,8A,8A+,8B,8B+,8C,8C+|WI2,WI3,WI3+,WI4,WI4+,WI5,WI5+,WI6,WI6+,WI7,WI7+|M1,M2,M3,M4,M5,M6,M7,M8,M9,M10,M11,M12|Set|Lap'.split('|');
  var GL=[41,24,29,11,14,30,11,12,1,1];
  var sys=0;
  var step=0;
  var proj=[-1,-1,-1,-1,-1];
  var ws=localStorage.getObject('watchSetup');
  if(ws&&ws.sys>=0&&ws.sys<=9)sys=ws.sys|0;
  var sv=localStorage.getObject('stats')||{};
  for(var i=0;i<5;i++){var p=sv['p'+sys+'_'+(i+1)];if(p!=null&&p>=-1)proj[i]=p|0}
  function dG(i){return i<0?'OFF':(G[sys].split(',')[i]||'?')}
  function render(){setText('#projN',''+(step+1));setText('#grade',dG(proj[step]))}
  function cyc(d){var L=GL[sys],v=proj[step]+d;proj[step]=v>=L?-1:v<-1?L-1:v;render()}
  function nxt(){step=(step+1)%5;render()}
  function sav(){var v=0;for(var i=0;i<5;i++)v|=(proj[i]+1)<<(i*6);$.put('/Zapp/{zapp_index}/Event',100+v,null,'int32')}
  render();
">
  <div id="climblogger">

    <!-- Step title: PROJECT N -->
    <div class="sp-b-s p-hc" style="top:calc(22% - 50%e);">
      <span>PROJECT </span>
      <span id="projN" class="f-num">1</span>
    </div>

    <!-- Up-arrow tap-bar (grade -) -->
    <div onTap="cyc(-1)"
      style="top:17%;left:0;width:70%;height:22%;position:absolute;"></div>
    <div class="f-ico p-hc" style="top:calc(36% - 50%e);">&#xF266;</div>

    <!-- Project grade (hero) -->
    <div id="grade" class="sp-t-l" style="top:calc(48% - 50%e); left:calc(50% - 50%e);">OFF</div>

    <!-- Down-arrow tap-bar (grade +) -->
    <div onTap="cyc(1)"
      style="top:57%;left:0;width:70%;height:25%;position:absolute;"></div>
    <div class="f-ico p-hc" style="top:calc(66% - 50%e);">&#xF267;</div>

    <!-- Down-button pill (E373 = save & exit, matches down-long) -->
    <div style="top:70%;left:83%;width:15%;height:12%;position:absolute;">
      <div style="top:0; left:0; width:100%;height:100%;position:absolute;
                  background:rgba(255,255,255,0.15);
                  border-radius:40% 0 0 40%;">
        <div class="f-ico cm-bgc"
             style="top:calc(45% - 50%e); left:6px;">&#xE373;</div>
      </div>
    </div>
    <div onTap="sav()"
      style="top:63%;left:70%;width:30%;height:25%;position:absolute;"></div>

    <!-- Physical: up/down=grade, mid=next slot, down-long=save&exit -->
    <:if test="{{ HAS_ON_EVENT }}">
    <userInput>
      <pushButton name="up" type="lock" longType="lock"
        onClick="cyc(-1)"
        onLongPressStart="cyc(-1)" />
      <pushButton name="next" longType="lock"
        onClick="nxt()"
        onLongPressStart="nxt()" />
      <pushButton name="down" type="lock" longType="lock"
        onClick="cyc(1)"
        onLongPressStart="sav()" />
    </userInput>
    </:if>

  </div>
</uiView>
