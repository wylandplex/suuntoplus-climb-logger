<uiView onFlickUp="ev(7)"
        onFlickDown="ev(8)"
        onLoad="
          function dG(x){if(x<0)return'--';var s=Math.floor(x/100),i=x%100;if(i>=50)return'OFF';if(s===0)return(3+Math.floor(i/6))+'abc'.charAt(Math.floor(i/2)%3)+(i%2?'+':'');if(s===1){var u=(i-2)%3;return i<2?'4'+(i?'+':''):''+(5+Math.floor((i-2)/3))+(u===0?'-':u===2?'+':'');}if(s===2)return i<5?'5.'+(i+5):'5.'+(10+Math.floor((i-5)/4))+'abcd'.charAt((i-5)%4);if(s===3)return(4+Math.floor(i/3))+'abc'.charAt(i%3);if(s===4)return i?'V'+(i-1):'VB';if(s===5)return(4+Math.floor(i/6))+'ABC'.charAt(Math.floor(i/2)%3)+(i%2?'+':'');if(s===6)return'WI'+(i?3+Math.floor((i-1)/2):2)+(i&&(i-1)%2?'+':'');if(s===7)return'M'+(i+1);return s===8?'Set':'Lap';}
          var S=-1,lock=0;
          function aV(x){
            if(x===S)return;
            S=x;
            setStyle('#sc1','visibility',x===1?'VISIBLE':'HIDDEN');
            setStyle('#sc2','visibility',x===2?'VISIBLE':'HIDDEN');
          }
          function hC(x){setStyle('#hg','visibility',x===1?'VISIBLE':'HIDDEN');setStyle('#ho','visibility',x===2?'VISIBLE':'HIDDEN')}
          function ev(n){$.put('/Zapp/{zapp_index}/Event',n,null,'int32')}
          function lap(){$.put('/Activity/Trigger',23)}
          function ulk(){lock=0}
          function evX(n){if(lock)return;ev(n);lock=1;setTimeout(ulk,300)}
          function evL(n){if(lock)return;if(S===1)lap();ev(n);lock=1;setTimeout(ulk,300)}
        ">
  <div id="climblogger">


    <!-- vState → aV (the applyVis pattern): <eval> binding replaces leaky $.subscribe (#90). Eval bindings are framework-managed, do not leak on template unload. Both trackers (vState→aV, hdrRes→hC) share ONE 0-dim holder div. -->
    <!-- SuuntoPlus CSS parser rejects display:none → use visibility:HIDDEN + 0-dim instead. -->
    <div style="position:absolute;top:0;left:0;width:0;height:0;visibility:HIDDEN"><eval input="/Zapp/{zapp_index}/Output/vState" outputFormat="script x => (aV(x),'')" default="" /><eval input="/Zapp/{zapp_index}/Output/hdrRes" outputFormat="script x => (hC(x),'')" default="" /></div>

    <!-- READY lives in its own ready.html now (idle-split): this template mounts ONLY at
         READY->CLIMB and carries just the CLIMB/BREAK pair (zero per-lap swaps via aV). -->

    <!-- CLIMB — dashboard LIVE from the current lap (-1). Identical layout to BREAK (finished lap -2): switching CLIMB<->BREAK just swaps live<->frozen firmware-lap data. Grade = current; height = live; HR from Lap/-1. -->
    <!-- CLIMB — climb time + pulse, big and uncluttered. Grade lives in the colored header; height/avg/max are BREAK-only. -->
    <div id="sc1" style="position:absolute;top:0;left:0;width:100%;height:100%;visibility:VISIBLE">

      <div class="sp-d-l p-hc" style="top:calc(36% - 50%e);">
        <eval input="/Activity/Lap/-1/Duration/Current" outputFormat="Duration_FourdigitsFixed" default="0:00" />
      </div>

      <div style="top:18%;left:83%;width:15%;height:12%;position:absolute;background:rgba(255,255,255,0.15);">
        <div class="f-ico" style="top:calc(50% - 18.5px); left:6px;color:#fff;">&#xF110;</div>
      </div>
      <div onTap="evL(5)" style="top:11%;left:70%;width:30%;height:25%;position:absolute;"></div>

      <div style="top:70%;left:83%;width:15%;height:12%;position:absolute;background:rgba(255,255,255,0.15);">
        <div class="f-ico" style="top:calc(50% - 18.5px); left:6px;color:#fff;">&#xF200;</div>
      </div>
      <div onTap="evL(6)" style="top:63%;left:70%;width:30%;height:25%;position:absolute;"></div>
    </div>

    <!-- BREAK — same big time+pulse as CLIMB (frozen lap -2) PLUS the climb summary row: height, avg, max. Grade+result are in the colored header. -->
    <div id="sc2" style="position:absolute;top:0;left:0;width:100%;height:100%;visibility:HIDDEN">

      <div class="sp-d-l p-hc" style="top:calc(30% - 50%e);">
        <eval input="/Activity/Lap/-2/Duration/Current" outputFormat="Duration_FourdigitsFixed" default="0:00" />
      </div>

      <div class="p-hc sp-vertical-center" style="top:calc(73% - 20.5px);">
        <span class="sp-b-s" style="padding-right:3px">H</span>
        <span class="sp-b-s f-num" style="padding-right:14px"><eval input="/Zapp/{zapp_index}/Output/routeHeight" outputFormat="script x => (x>=0?'+':'')+x+'m'" default="0m" /></span>
        <span class="sp-b-s" style="padding-right:3px">AVG</span>
        <span class="sp-b-s f-num"><eval input="/Activity/Lap/-2/HeartRate/Avg" outputFormat="HeartRate_Fourdigits" default="--" /></span>
        <span class="sp-b-s" style="padding-left:12px;padding-right:3px">MAX</span>
        <span class="sp-b-s f-num"><eval input="/Activity/Lap/-2/HeartRate/Max" outputFormat="HeartRate_Fourdigits" default="--" /></span>
      </div>

      <div style="top:44%;left:90%;width:10%;height:12%;position:absolute;background:rgba(255,255,255,0.15);">
        <div class="f-ico cm-bgc" style="top:calc(50% - 18.5px); left:6px;">&#xE338;</div>
      </div>
      <div onTap="evX(4)" style="top:37%;left:70%;width:30%;height:25%;position:absolute;"></div>

      <div style="top:70%;left:83%;width:15%;height:12%;position:absolute;background:rgba(255,255,255,0.15);">
        <div class="f-ico cm-bgc" style="top:calc(50% - 18.5px); left:6px;">&#xE373;</div>
      </div>
      <div onTap="evX(6)" style="top:63%;left:70%;width:30%;height:25%;position:absolute;"></div>
    </div>

    <!-- Shared live-HR row: the CLIMB (sc1) and BREAK (sc2) HR eval were byte-identical (both read the
         live Move/-1 Current). Authored once here, always-visible over whichever section is shown. Anchored
         at BREAK's 53% (its summary row @73% constrains it); CLIMB's HR shifts up from 64% to match. -->
    <div class="sp-vertical-center" style="top:calc(53% - 50%e); left:calc(50% - 50%e);">
      <span class="f-ico sp-c-red" style="padding-right:6px">&#xF101;</span>
      <span class="sp-d-m"><eval input="/Activity/Move/-1/Heartrate/Current" outputFormat="HeartRate_Fourdigits" default="--" /></span>
    </div>

    <!-- Shared ROUTE/PROJECT header — one always-visible band. Was triplicated across sc0/sc1/sc2 with
         identical content; authored once here (rendered last so it sits above the section tops). Saves
         2 cm-fg bands + 2 evals + 2 self-size measure-passes from the resident active mount. -->
    <div id="hdr" style="position:absolute;top:0;left:0;width:100%;height:16%;background:rgba(255,255,255,0.12)">
      <!-- result bands: pre-built green/orange, toggled by hC via the PROVEN visibility mechanism. Runtime setStyle only applies 'visibility' (like aV), NOT 'background' — the old inline setStyle('#hdr','background',rgba) was a silent on-watch no-op. Bands sit BEHIND the text. -->
      <div id="hg" style="position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(45,175,75,0.5);visibility:HIDDEN"></div>
      <div id="ho" style="position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(235,140,25,0.5);visibility:HIDDEN"></div>
      <div class="sp-t-s p-hc" style="top:calc(50% - 19px); left:calc(50% - 50%e);">
        <span><eval input="/Zapp/{zapp_index}/Output/modeSub" outputFormat="script x => x > 0 ? '#' + x : 'P' + Math.abs(x)" default="#1" /></span>
        <span style="padding-left:16px"><eval input="/Zapp/{zapp_index}/Output/hdrGrade" outputFormat="script x => x < 0 ? '' : dG(x)" default="" /></span>
      </div>
    </div>

    <!-- Bottom time-bar: a cheap flat-fill backing panel (replaces the removed clip-path diamond, a costly
         per-pixel mask). The 2px top hairline (and BREAK's summary hairline) were dropped in the trim-audit
         — plain rgba rects are cheap, but the accent lines still cost box + measure passes on this mount. -->
    <div class="p-hc" style="top:87%;width:70%;height:9%;background:rgba(255,255,255,0.12)"></div>
    <!-- left:calc(50% - 50%e) self-centers the row by its own width (exact, panel-independent); top 91.5% =
         the panel's vertical center (87%+9%/2) so the text sits centered in the bar, not riding its top edge. -->
    <div class="sp-vertical-center" style="left:calc(50% - 50%e); top:calc(91.5% - 20.5px);">
      <span class="sp-b-s f-num"><eval input="/Dev/Time/LocalTime" outputFormat="script x => ('0'+Math.floor((x/3600)%24)).slice(-2)+':'+('0'+Math.floor((x/60)%60)).slice(-2)" default="--:--" /></span>
      <span class="f-ico" style="padding-left:6px;padding-right:6px">&#xF100;</span>
      <span class="sp-b-s f-num"><eval input="/Activity/Move/-1/Duration/Current" outputFormat="Duration_FourdigitsFixed" default="0:00" /></span>
    </div>

    <!-- Physical pushButtons — universal events, main.js dispatches by state -->
    <:if test="{{ HAS_ON_EVENT }}">
    <userInput>
      <!-- onLongPressFull consumes the full long-press phase so the firmware button defaults
           (up=Multisport, down=Control Panel) don't fire on the app's up/down long-press actions —
           including entering EDIT/proj-setup from READY. 'next' stays free (middle = screen nav). -->
      <pushButton name="up" type="lock" longType="lock"
        onClick="ev(1)"
        onLongPressStart="evL(5)"
        onLongPressFull=";" />
      <pushButton name="next" longType="lock"
        onLongPressStart="ev(4)" />
      <pushButton name="down" type="lock" longType="lock"
        onClick="ev(2)"
        onLongPressStart="evL(6)"
        onLongPressFull=";" />
    </userInput>
    </:if>

  </div>
</uiView>
