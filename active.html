<uiView onFlickUp="ev(7)"
        onFlickDown="ev(8)"
        onLoad="
          var M=Math.floor,S=-1,lock=0;
          function dG(x){if(x<0)return'--';var s=M(x/100),i=x%100;if(i>=50)return'OFF';if(s===0)return(3+M(i/6))+'abc'.charAt(M(i/2)%3)+(i%2?'+':'');if(s===1){var u=(i-2)%3;return i<2?'4'+(i?'+':''):''+(5+M((i-2)/3))+(u===0?'-':u===2?'+':'');}if(s===2)return i<5?'5.'+(i+5):'5.'+(10+M((i-5)/4))+'abcd'.charAt((i-5)%4);if(s===3)return(4+M(i/3))+'abc'.charAt(i%3);if(s===4)return i?'V'+(i-1):'VB';if(s===5)return(4+M(i/6))+'ABC'.charAt(M(i/2)%3)+(i%2?'+':'');if(s===6)return'WI'+(i?3+M((i-1)/2):2)+(i&amp;&amp;(i-1)%2?'+':'');if(s===7)return'M'+(i+1);return s===8?'Set':'Lap';}
          function tm(x){return M(x/60)+&quot;'&quot;+('0'+M(x%60)).slice(-2)}
          function aV(x){if(x===S)return;S=x;setVis('#sc1',x===1);setVis('#sc2',x===2);setText('#ba',String.fromCharCode(x===1?0xF200:0xE373))}
          function pV(x){setVis('#ma',x>=0);return x}
          function hC(x){setVis('#hgb',x===1);setVis('#hob',x===2)}
          function ev(n){$.put('/Zapp/{zapp_index}/Event',n,null,'int32')}
          function lap(){$.put('/Activity/Trigger',23)}
          function ulk(){lock=0}
          function evX(n){if(lock)return;ev(n);lock=1;setTimeout(ulk,300)}
          function evL(n){if(lock)return;if(S===1)lap();ev(n);lock=1;setTimeout(ulk,300)}
          setStyle('#ht','TRANSFORMCONTENT',transformation().rotate(.5));
        ">
  <!-- ============================================================================================
       LAYOUT = ZoneSense, Suunto's own app, decompiled from b:/zapp/zzaeroen.fea pulled off the watch.
       The goal is that this reads as a NATIVE Suunto screen. Its rules, taken from its t.xml rather
       than guessed:

         - ONE background: cm-bg on the root. No panels, no translucent rects behind values. Suunto
           screens are black; our bars and pills are what made this look third-party.
         - Label ABOVE value, never beside. Label = sp-t-s + cm-mid (small, GREY #CCC); the value sits
           under it in a display face.
         - The bottom value is the hero: full width, from 76% to the rim, in a MEDIUM DISPLAY face
           (f-d-m = 78 px here). Ours sat in a TEXT face (f-t-m = 33 px) — that 3x is the entire reason
           it looked tiny.
         - Title = text-medium centred at 15%; secondary line = text-small grey at 25%.
         - Icons are grey (f-ico + cm-mid), not white.

       Source classes are sp-*; the build maps them onto those f-* faces per display.

       NO <:if test="{APP_IS_DISPLAY_LARGE}"> ANYWHERE. Suunto's example templates branch icon placement
       with it, but build-app.js — the compiler our BLE deploy path uses — does NOT resolve that token.
       Both arms land in the compiled XML as an <if> node and the FIRMWARE picks one at render time: the
       screen looks right while BOTH arms sit in the always-mounted UI tree. Measured on this very file:
       17 318 B with the branches vs 12 799 B with one arm — 4.5 KB of the pool that decides whether the
       watch evicts the user's other apps, spent on markup the device never draws. Contrast
       {{ HAS_ON_EVENT }} (double braces), which IS substituted at build time and is safe.
       ============================================================================================ -->
  <div class="cm-bg">

    <!-- BACKING LAYER: the upper tooth stays neutral on every screen; static lower result variants
         avoid unreliable runtime colour changes. -->
    <div id="ht" style="position:absolute;top:0;left:0;width:100%;height:24%">
      <img src="tooth.png" class="p-hc" style="top:calc(100% - 100%e);color:#343740" />
    </div>
    <img src="tooth.png" class="p-hc" style="top:calc(100% - 100%e);color:#262a35" />
    <img id="hgb" src="tooth.png" class="p-hc" style="top:calc(100% - 100%e);color:#2D7842;visibility:HIDDEN" />
    <img id="hob" src="tooth.png" class="p-hc" style="top:calc(100% - 100%e);color:#945A1E;visibility:HIDDEN" />

    <!-- vState -> aV, hdrRes -> hC (the applyVis pattern): <eval> bindings replace a leaky $.subscribe
         (#90) — framework-managed, they do not leak on template unload. Audit U5: bare side-effect
         evals, the 0-dim holder box is gone (bare pattern on-watch proven in ready.html). -->
    <eval input="/Zapp/{zapp_index}/Output/vState" outputFormat="script x => (aV(x),'')" default="" />
    <eval input="/Zapp/{zapp_index}/Output/hdrRes" outputFormat="script x => (hC(x),'')" default="" />
    <eval input="/Activity/Zones/HeartRate/Position" outputFormat="script x => ((typeof x==='number'&amp;&amp;isFinite(x)&amp;&amp;x&gt;0&amp;&amp;x&lt;1)?(setVis('#z-ind',1),gaugeControl('#z-ind',x*2*Math.PI,'radian')):setVis('#z-ind',0),'')" default="" />

    <!-- Compact title row — route number and grade. -->
    <div class="sp-t-s p-hc" style="top:calc(8% - 50%e)">
      <span><eval input="/Zapp/{zapp_index}/Output/modeSub" outputFormat="script x => (pV(x),x > 0 ? '#' + x : 'P' + Math.abs(x))" default="#1" /></span>
      <span style="padding-left:14px"><eval input="/Zapp/{zapp_index}/Output/hdrGrade" outputFormat="script x => x < 0 ? '' : dG(x)" default="" /></span>
    </div>

    <!-- Compact secondary row — clock, the original F100 separator and session duration. -->
    <div class="sp-b-s p-hc" style="top:calc(18% - 50%e)">
      <span class="f-num"><eval input="/Dev/Time/LocalTime" outputFormat="script x => ('0'+M((x/3600)%24)).slice(-2)+':'+('0'+M((x/60)%60)).slice(-2)" default="--:--" /></span>
      <span class="f-ico" style="padding-left:6px;padding-right:6px">&#xF100;</span>
      <span class="f-num"><eval input="/Activity/Move/-1/Duration/Current" outputFormat="Duration_FourdigitsFixed" default="0:00" /></span>
    </div>

    <!-- Large state-independent height. The unit uses a text face because the numeric face has no letters. -->
    <div class="p-hc sp-vertical-center" style="top:calc(36% - 50%e)">
      <span class="sp-d-s f-num"><eval input="/Zapp/{zapp_index}/Output/routeHeight" outputFormat="script x => (x>=0?'+':'')+x" default="+0" /></span>
      <span class="sp-b-l" style="padding-left:4px">m</span>
    </div>

    <!-- Live HR stays large and central in both states. BREAK alone adds small AVG/MAX side values. -->
    <div class="sp-d-l f-num p-hc" style="top:calc(59% - 50%e)">
      <eval input="/Activity/Move/-1/Heartrate/Current" outputFormat="HeartRate_Fourdigits" default="--" />
    </div>

    <!-- CLIMB — the OPEN lap. ready.html fires lap() on START and evL() fires it only while S===1, so
         Lap/-1 really brackets the climb attempt rather than mixing rest and climbing. -->
    <div id="sc1" style="position:absolute;top:0;left:0;width:100%;height:100%;visibility:VISIBLE">
      <!-- THE HERO (ZoneSense: p-tc p-hc + medium display face, full width, 76% to the rim).
           f-num is a FONT FAMILY (SuuntoUINextDisplaySemibold), not a glyph filter: it carries no
           letters — which is why labels need a text face — but it DOES carry the apostrophe, exactly as
           Suunto's own big pace readouts (9'30) show. Formatted here rather than through a guessed
           Suunto format name. Whole seconds: a tenths digit would flicker ten times a second all route. -->
      <div class="sp-d-l f-num p-tc p-hc" style="top:calc(85% - 50%e);width:100%">
        <eval input="/Activity/Lap/-1/Duration/Current" outputFormat="script x => tm(x)" default="0'00" />
      </div>

      <!-- Tap zones and white action glyphs: FAIL top-right, SEND bottom-right. -->
      <div class="f-ico" style="top:calc(24% - 18.5px);left:calc(85% - 50%e);">&#xF110;</div>
      <div onTap="evL(5)" style="top:11%;left:70%;width:30%;height:25%;position:absolute"></div>
    </div>

    <!-- BREAK — the CLOSED lap (-2). AVG/MAX appear only once the attempt is complete. -->
    <div id="sc2" style="position:absolute;top:0;left:0;width:100%;height:100%;visibility:HIDDEN">
      <div class="sp-t-s cm-mid" style="top:calc(50% - 50%e);left:calc(23% - 50%e)">AVG</div>
      <div class="sp-t-s cm-mid" style="top:calc(50% - 50%e);left:calc(77% - 50%e)">MAX</div>
      <div class="sp-d-xs f-num" style="top:calc(59% - 50%e);left:calc(23% - 50%e)">
        <eval input="/Activity/Lap/-2/HeartRate/Avg" outputFormat="HeartRate_Fourdigits" default="--" />
      </div>
      <div class="sp-d-xs f-num" style="top:calc(59% - 50%e);left:calc(77% - 50%e)">
        <eval input="/Activity/Lap/-2/HeartRate/Max" outputFormat="HeartRate_Fourdigits" default="--" />
      </div>

      <div class="sp-d-l f-num p-tc p-hc" style="top:calc(85% - 50%e);width:100%">
        <eval input="/Activity/Lap/-2/Duration/Current" outputFormat="script x => tm(x)" default="0'00" />
      </div>

      <div id="ma" class="f-ico" style="top:calc(47% - 18.5px);left:calc(94% - 50%e - 3px)">&#xE338;</div>
      <div onTap="evX(4)" style="top:37%;left:70%;width:30%;height:25%;position:absolute"></div>
    </div>

    <!-- Same position and action in both states; only the glyph changes. Sharing these nodes keeps the
         full UI while avoiding a second always-mounted icon and hit target. -->
    <div id="ba" class="f-ico" style="top:calc(76% - 18.5px);left:calc(85% - 50%e);">&#xF200;</div>
    <div onTap="evL(6)" style="top:63%;left:70%;width:30%;height:25%;position:absolute"></div>



    <!-- Firmware-rendered rim gauge. The import passes through to the XML unexpanded and the watch draws
         it: 35 bytes, measured. The canvas we once built for this allocated a ~217 KB render surface and
         got the user's other apps evicted. -->
    <import src="#zone-g" />

    <!-- Physical pushButtons — universal events, main.js dispatches by state -->
    <:if test="{{ HAS_ON_EVENT }}">
    <userInput>
      <!-- onLongPressFull consumes the full long-press phase so the firmware defaults (up=Multisport,
           down=Control Panel) don't fire on the app's long-press actions. 'next' (mid-short) stays free
           — it is Suunto's activity-screen scroll. -->
      <pushButton name="up" type="lock" longType="lock"
        onClick="ev(1)"
        onLongPressStart="evL(5)"
        onLongPressFull=";" />
      <pushButton name="next" longType="lock"
        onLongPressStart="ev(4)" />
      <pushButton name="down" type="lock" longType="lock"
        onClick="ev(2)"
        onLongPressStart="evL(6)"
        onLongPressFull=";" />
    </userInput>
    </:if>

  </div>
</uiView>
