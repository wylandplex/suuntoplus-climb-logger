<uiView onFlickUp="ev(7)"
        onFlickDown="ev(8)"
        onLoad="
          function dG(x){if(x<0)return'--';var s=Math.floor(x/100),i=x%100;if(i>=50)return'OFF';if(s===0)return(3+Math.floor(i/6))+'abc'.charAt(Math.floor(i/2)%3)+(i%2?'+':'');if(s===1){var u=(i-2)%3;return i<2?'4'+(i?'+':''):''+(5+Math.floor((i-2)/3))+(u===0?'-':u===2?'+':'');}if(s===2)return i<5?'5.'+(i+5):'5.'+(10+Math.floor((i-5)/4))+'abcd'.charAt((i-5)%4);if(s===3)return(4+Math.floor(i/3))+'abc'.charAt(i%3);if(s===4)return i?'V'+(i-1):'VB';if(s===5)return(4+Math.floor(i/6))+'ABC'.charAt(Math.floor(i/2)%3)+(i%2?'+':'');if(s===6)return'WI'+(i?3+Math.floor((i-1)/2):2)+(i&&(i-1)%2?'+':'');if(s===7)return'M'+(i+1);return s===8?'Set':'Lap';}
          var S=-1,lock=0;
          function aV(x){
            if(x===S)return;
            S=x;
            setStyle('#sc1','visibility',x===1?'VISIBLE':'HIDDEN');
            setStyle('#sc2','visibility',x===2?'VISIBLE':'HIDDEN');
          }
          function hC(x){setStyle('#hg','visibility',x===1?'VISIBLE':'HIDDEN');setStyle('#ho','visibility',x===2?'VISIBLE':'HIDDEN')}
          function ev(n){$.put('/Zapp/{zapp_index}/Event',n,null,'int32')}
          function lap(){$.put('/Activity/Trigger',23)}
          function ulk(){lock=0}
          function evX(n){if(lock)return;ev(n);lock=1;setTimeout(ulk,300)}
          function evL(n){if(lock)return;if(S===1)lap();ev(n);lock=1;setTimeout(ulk,300)}
        ">
  <!-- ============================================================================================
       LAYOUT = ZoneSense, Suunto's own app, decompiled from b:/zapp/zzaeroen.fea pulled off the watch.
       The goal is that this reads as a NATIVE Suunto screen. Its rules, taken from its t.xml rather
       than guessed:

         - ONE background: cm-bg on the root. No panels, no translucent rects behind values. Suunto
           screens are black; our bars and pills are what made this look third-party.
         - Label ABOVE value, never beside. Label = sp-t-s + cm-mid (small, GREY #CCC); the value sits
           under it in a display face.
         - The bottom value is the hero: full width, from 76% to the rim, in a MEDIUM DISPLAY face
           (f-d-m = 78 px here). Ours sat in a TEXT face (f-t-m = 33 px) — that 3x is the entire reason
           it looked tiny.
         - Title = text-medium centred at 15%; secondary line = text-small grey at 25%.
         - Icons are grey (f-ico + cm-mid), not white.

       Source classes are sp-*; the build maps them onto those f-* faces per display.

       NO <:if test="{APP_IS_DISPLAY_LARGE}"> ANYWHERE. Suunto's example templates branch icon placement
       with it, but build-app.js — the compiler our BLE deploy path uses — does NOT resolve that token.
       Both arms land in the compiled XML as an <if> node and the FIRMWARE picks one at render time: the
       screen looks right while BOTH arms sit in the always-mounted UI tree. Measured on this very file:
       17 318 B with the branches vs 12 799 B with one arm — 4.5 KB of the pool that decides whether the
       watch evicts the user's other apps, spent on markup the device never draws. Contrast
       {{ HAS_ON_EVENT }} (double braces), which IS substituted at build time and is safe.
       ============================================================================================ -->
  <div id="climblogger" class="cm-bg">

    <!-- vState -> aV, hdrRes -> hC (the applyVis pattern): <eval> bindings replace a leaky $.subscribe
         (#90) — framework-managed, they do not leak on template unload. Both trackers share ONE 0-dim
         holder. The SuuntoPlus CSS parser rejects display:none, so hidden means visibility:HIDDEN. -->
    <div style="position:absolute;top:0;left:0;width:0;height:0;visibility:HIDDEN"><eval input="/Zapp/{zapp_index}/Output/vState" outputFormat="script x => (aV(x),'')" default="" /><eval input="/Zapp/{zapp_index}/Output/hdrRes" outputFormat="script x => (hC(x),'')" default="" /></div>

    <!-- Result tint. ZoneSense has no coloured bands, but SEND/FAIL must be legible at a glance. Runtime
         setStyle applies visibility RELIABLY and background NOT AT ALL (the old
         setStyle('#hdr','background',...) was a silent on-watch no-op), so both tints are PRE-BUILT and
         toggled by visibility. Low opacity, behind the title only: the screen still reads as black. -->
    <div id="hg" style="position:absolute;top:0;left:0;width:100%;height:30%;background:rgba(45,175,75,0.35);visibility:HIDDEN"></div>
    <div id="ho" style="position:absolute;top:0;left:0;width:100%;height:30%;background:rgba(235,140,25,0.35);visibility:HIDDEN"></div>

    <!-- Title (ZoneSense: f-t-m p-hc @ 15%) — route number and grade. -->
    <div class="sp-t-m p-hc" style="top:calc(15% - 50%e)">
      <span><eval input="/Zapp/{zapp_index}/Output/modeSub" outputFormat="script x => x > 0 ? '#' + x : 'P' + Math.abs(x)" default="#1" /></span>
      <span style="padding-left:14px"><eval input="/Zapp/{zapp_index}/Output/hdrGrade" outputFormat="script x => x < 0 ? '' : dG(x)" default="" /></span>
    </div>

    <!-- Secondary line (ZoneSense: f-t-s cm-mid p-hc @ 25%) — session duration and clock, grey. -->
    <div class="sp-t-s cm-mid p-hc" style="top:calc(25% - 50%e)">
      <span class="f-num"><eval input="/Activity/Move/-1/Duration/Current" outputFormat="Duration_FourdigitsFixed" default="0:00" /></span>
      <span class="f-num" style="padding-left:16px"><eval input="/Dev/Time/LocalTime" outputFormat="script x => ('0'+Math.floor((x/3600)%24)).slice(-2)+':'+('0'+Math.floor((x/60)%60)).slice(-2)" default="--:--" /></span>
    </div>

    <!-- Route height (ZoneSense: the wide value @ 34%). State-independent: routeHeight already publishes
         live ascent in CLIMB and the finished route's height in BREAK, so ONE element serves both.
         Duplicating it is exactly how the old rows drifted apart and made H jump on every lap. -->
    <div class="sp-d-xs p-hc" style="top:calc(34% - 50%e)">
      <eval input="/Zapp/{zapp_index}/Output/routeHeight" outputFormat="script x => (x>=0?'+':'')+x+'m'" default="+0m" />
    </div>

    <!-- Three-column band (ZoneSense: labels @ 45%, values @ 55%). The live pulse is state-independent
         and authored once; AVG and MAX depend on the lap index and live in sc1/sc2 at the IDENTICAL
         anchors, so nothing can shift on a lap change. -->
    <div class="sp-t-s cm-mid" style="top:calc(45% - 50%e);left:calc(20% - 50%e)">HR</div>
    <div class="sp-d-xs f-num" style="top:calc(55% - 50%e);left:calc(20% - 50%e)">
      <eval input="/Activity/Move/-1/Heartrate/Current" outputFormat="HeartRate_Fourdigits" default="--" />
    </div>
    <div class="sp-t-s cm-mid" style="top:calc(45% - 50%e);left:calc(50% - 50%e)">AVG</div>
    <div class="sp-t-s cm-mid" style="top:calc(45% - 50%e);left:calc(80% - 50%e)">MAX</div>

    <!-- CLIMB — the OPEN lap. ready.html fires lap() on START and evL() fires it only while S===1, so
         Lap/-1 really brackets the climb attempt rather than mixing rest and climbing. -->
    <div id="sc1" style="position:absolute;top:0;left:0;width:100%;height:100%;visibility:VISIBLE">
      <div class="sp-d-xs f-num" style="top:calc(55% - 50%e);left:calc(50% - 50%e)">
        <eval input="/Activity/Lap/-1/HeartRate/Avg" outputFormat="HeartRate_Fourdigits" default="--" />
      </div>
      <div class="sp-d-xs f-num" style="top:calc(55% - 50%e);left:calc(80% - 50%e)">
        <eval input="/Activity/Lap/-1/HeartRate/Max" outputFormat="HeartRate_Fourdigits" default="--" />
      </div>

      <!-- THE HERO (ZoneSense: p-tc p-hc + medium display face, full width, 76% to the rim).
           f-num is a FONT FAMILY (SuuntoUINextDisplaySemibold), not a glyph filter: it carries no
           letters — which is why labels need a text face — but it DOES carry the apostrophe, exactly as
           Suunto's own big pace readouts (9'30) show. Formatted here rather than through a guessed
           Suunto format name. Whole seconds: a tenths digit would flicker ten times a second all route. -->
      <div class="sp-d-m f-num p-tc p-hc" style="top:calc(76% - 50%e);width:100%">
        <eval input="/Activity/Lap/-1/Duration/Current" outputFormat="script x => Math.floor(x/60) + &quot;'&quot; + ('0' + Math.floor(x%60)).slice(-2)" default="0'00" />
      </div>

      <!-- Tap zones and their button hints. Bare grey icons, no panels — the panels were half of what
           made this look un-Suunto. FAIL top-right, SEND bottom-right. -->
      <div class="f-ico cm-mid" style="top:calc(24% - 18.5px);left:calc(91% - 50%e)">&#xF110;</div>
      <div onTap="evL(5)" style="top:11%;left:70%;width:30%;height:25%;position:absolute"></div>
      <div class="f-ico cm-mid" style="top:calc(70% - 18.5px);left:calc(91% - 50%e)">&#xF200;</div>
      <div onTap="evL(6)" style="top:63%;left:70%;width:30%;height:25%;position:absolute"></div>
    </div>

    <!-- BREAK — the CLOSED lap (-2). Identical anchors to sc1: nothing may move on a lap change. -->
    <div id="sc2" style="position:absolute;top:0;left:0;width:100%;height:100%;visibility:HIDDEN">
      <div class="sp-d-xs f-num" style="top:calc(55% - 50%e);left:calc(50% - 50%e)">
        <eval input="/Activity/Lap/-2/HeartRate/Avg" outputFormat="HeartRate_Fourdigits" default="--" />
      </div>
      <div class="sp-d-xs f-num" style="top:calc(55% - 50%e);left:calc(80% - 50%e)">
        <eval input="/Activity/Lap/-2/HeartRate/Max" outputFormat="HeartRate_Fourdigits" default="--" />
      </div>

      <div class="sp-d-m f-num p-tc p-hc" style="top:calc(76% - 50%e);width:100%">
        <eval input="/Activity/Lap/-2/Duration/Current" outputFormat="script x => Math.floor(x/60) + &quot;'&quot; + ('0' + Math.floor(x%60)).slice(-2)" default="0'00" />
      </div>

      <div class="f-ico cm-mid" style="top:calc(47% - 18.5px);left:calc(95% - 50%e)">&#xE338;</div>
      <div onTap="evX(4)" style="top:37%;left:70%;width:30%;height:25%;position:absolute"></div>
      <div class="f-ico cm-mid" style="top:calc(70% - 18.5px);left:calc(91% - 50%e)">&#xE373;</div>
      <div onTap="evX(6)" style="top:63%;left:70%;width:30%;height:25%;position:absolute"></div>
    </div>


    <!-- THE SHAPE. ZoneSense anchors a firmware image at the bottom rim, horizontally centred, and the
         big value sits in it: <img src="tooth.png" class="p-hc" style="top:calc(100% - 100%e)">.
         tooth.png is NOT bundled in ZoneSense's .fea (that archive holds four files: data.jsn, main.js,
         manifest.jsn, t.xml) — it is a firmware-resident asset, like hint-btn-top.png. This is what makes
         a Suunto screen look like a Suunto screen; we had been drawing translucent rectangles instead. -->
    <img src="tooth.png" class="p-hc" style="top:calc(100% - 100%e)" />

    <!-- Firmware-rendered rim gauge. The import passes through to the XML unexpanded and the watch draws
         it: 35 bytes, measured. The canvas we once built for this allocated a ~217 KB render surface and
         got the user's other apps evicted. -->
    <import src="#zone-g" />

    <!-- Physical pushButtons — universal events, main.js dispatches by state -->
    <:if test="{{ HAS_ON_EVENT }}">
    <userInput>
      <!-- onLongPressFull consumes the full long-press phase so the firmware defaults (up=Multisport,
           down=Control Panel) don't fire on the app's long-press actions. 'next' (mid-short) stays free
           — it is Suunto's activity-screen scroll. -->
      <pushButton name="up" type="lock" longType="lock"
        onClick="ev(1)"
        onLongPressStart="evL(5)"
        onLongPressFull=";" />
      <pushButton name="next" longType="lock"
        onLongPressStart="ev(4)" />
      <pushButton name="down" type="lock" longType="lock"
        onClick="ev(2)"
        onLongPressStart="evL(6)"
        onLongPressFull=";" />
    </userInput>
    </:if>

  </div>
</uiView>
