<uiView onFlickUp="ev(7)"
        onFlickDown="ev(8)"
        onLoad="
          function dG(x){if(x<0)return'--';var s=Math.floor(x/100),i=x%100;if(i>=50)return'OFF';if(s===0)return(3+Math.floor(i/6))+'abc'.charAt(Math.floor(i/2)%3)+(i%2?'+':'');if(s===1){var u=(i-2)%3;return i<2?'4'+(i?'+':''):''+(5+Math.floor((i-2)/3))+(u===0?'-':u===2?'+':'');}if(s===2)return i<5?'5.'+(i+5):'5.'+(10+Math.floor((i-5)/4))+'abcd'.charAt((i-5)%4);if(s===3)return(4+Math.floor(i/3))+'abc'.charAt(i%3);if(s===4)return i?'V'+(i-1):'VB';if(s===5)return(4+Math.floor(i/6))+'ABC'.charAt(Math.floor(i/2)%3)+(i%2?'+':'');if(s===6)return'WI'+(i?3+Math.floor((i-1)/2):2)+(i&&(i-1)%2?'+':'');if(s===7)return'M'+(i+1);return s===8?'Set':'Lap';}
          var S=-1,lock=0;
          function aV(x){
            if(x===S)return;
            S=x;
            setStyle('#sc1','visibility',x===1?'VISIBLE':'HIDDEN');
            setStyle('#sc2','visibility',x===2?'VISIBLE':'HIDDEN');
          }
          function hC(x){setStyle('#hg','visibility',x===1?'VISIBLE':'HIDDEN');setStyle('#ho','visibility',x===2?'VISIBLE':'HIDDEN')}
          function ev(n){$.put('/Zapp/{zapp_index}/Event',n,null,'int32')}
          function lap(){$.put('/Activity/Trigger',23)}
          function ulk(){lock=0}
          function evX(n){if(lock)return;ev(n);lock=1;setTimeout(ulk,300)}
          function evL(n){if(lock)return;if(S===1)lap();ev(n);lock=1;setTimeout(ulk,300)}
        ">
    <!-- NO <:if test="{APP_IS_DISPLAY_LARGE}"> BRANCHES. Suunto's own templates branch the icon
         placement (above the number on large displays, beside it on small), but that conditional is
         NOT resolved at build time by build-app.js — which is the compiler our BLE deploy path uses.
         Both arms land in the compiled XML as an <if> node and the FIRMWARE picks one at render time,
         so the screen looks right while BOTH arms sit in the always-mounted UI tree. Measured on this
         very file: 17 318 B with the branches vs 12 799 B with one arm authored directly. That is
         4.5 KB of the pool that decides whether the watch evicts the user's other apps — spent on
         markup the device never draws. Suunto can afford it (their apps are ~2 KB); we cannot.
         So: ONE arm, authored once, using plain % containers + p-hc. It is also the portable one —
         percentages scale across the UI2 displays, unlike px, which the toolchain emits byte-identically
         into every variant. Cost of the whole grid redesign incl. the rim gauge: +974 B over the
         previous layout. -->
  <div id="climblogger">

    <!-- vState → aV (the applyVis pattern): <eval> binding replaces leaky $.subscribe (#90). Eval bindings are framework-managed, do not leak on template unload. Both trackers (vState→aV, hdrRes→hC) share ONE 0-dim holder div. -->
    <!-- SuuntoPlus CSS parser rejects display:none → use visibility:HIDDEN + 0-dim instead. -->
    <div style="position:absolute;top:0;left:0;width:0;height:0;visibility:HIDDEN"><eval input="/Zapp/{zapp_index}/Output/vState" outputFormat="script x => (aV(x),'')" default="" /><eval input="/Zapp/{zapp_index}/Output/hdrRes" outputFormat="script x => (hC(x),'')" default="" /></div>

    <!-- READY lives in its own ready.html now (idle-split): this template mounts ONLY at
         READY->CLIMB and carries just the CLIMB/BREAK pair (zero per-lap swaps via aV). -->

    <!-- Shared ROUTE/PROJECT title: Suunto's 25% cm-fg band, with the approved small session-time and
         clock line fitted beneath the route and grade. The four state-independent bindings are authored
         once; duplicating them made old CLIMB/BREAK rows drift when one copy changed. -->
    <div id="hdr" class="cm-fg" style="position:absolute;top:0;left:0;width:100%;height:25%">
      <!-- Result bands are pre-built and visibility-toggled. Runtime setStyle applies visibility reliably,
           but changing background was a silent on-watch no-op. -->
      <div id="hg" style="position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(45,175,75,0.5);visibility:HIDDEN"></div>
      <div id="ho" style="position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(235,140,25,0.5);visibility:HIDDEN"></div>
      <div class="sp-t-m" style="top:calc(34% - 50%e);left:calc(26% - 50%e)">
        <eval input="/Zapp/{zapp_index}/Output/modeSub" outputFormat="script x => x > 0 ? '#' + x : 'P' + Math.abs(x)" default="#1" />
      </div>
      <div class="sp-t-m" style="top:calc(34% - 50%e);left:calc(74% - 50%e)">
        <eval input="/Zapp/{zapp_index}/Output/hdrGrade" outputFormat="script x => x < 0 ? '' : dG(x)" default="" />
      </div>
      <div class="sp-b-s" style="top:calc(78% - 50%e);left:calc(26% - 50%e)">
        <eval input="/Activity/Move/-1/Duration/Current" outputFormat="Duration_Training" default="0'00.0" />
      </div>
      <div class="sp-b-s f-num" style="top:calc(78% - 50%e);left:calc(74% - 50%e)">
        <eval input="/Dev/Time/LocalTime" outputFormat="script x => ('0'+Math.floor((x/3600)%24)).slice(-2)+':'+('0'+Math.floor((x/60)%60)).slice(-2)" default="--:--" />
      </div>
    </div>

    <!-- Suunto's Layout 5 separator; its 32%-75% span divides only the 2x2 field grid. -->
    <div class="cm-fg p-hc" style="top:32%;width:2px;height:43%;opacity:0.4"></div>

    <!-- Shared top fields use Layout 5's exact 26/74% and 35/41% anchors. The %/%e placement is
         deliberate: horizontal px passed byte-identically to smaller UI2 displays and drifted there.
         Live pulse is state-independent, and routeHeight already publishes live ascent in CLIMB and
         lastHeight in BREAK; keeping H at one top-right anchor means it cannot jump on a lap. -->
    <div style="top:26%;left:3%;width:46%;height:30%">
      <div class="p-hc sp-vertical-center">
        <span class="f-ico sp-c-red" style="padding-right:4px">&#xF101;</span>
        <span class="sp-d-s f-num"><eval input="/Activity/Move/-1/Heartrate/Current" outputFormat="HeartRate_Fourdigits" default="--" /></span>
      </div>
    </div>
    <div style="top:26%;left:51%;width:46%;height:30%">
      <div class="p-hc sp-vertical-center">
        <span class="sp-t-s"><eval input="/Zapp/{zapp_index}/Output/routeHeight" outputFormat="script x => (x>=0?'+':'')+x+'m'" default="+0m" /></span>
        <span class="sp-b-s" style="padding-left:4px">H</span>
      </div>
    </div>

    <!-- Only climb time, AVG and MAX depend on lap index, so only these three fields are duplicated.
         Their <eval> inputs are static: OPEN Lap/-1 belongs in CLIMB and CLOSED Lap/-2 in BREAK.
         ready.html fires lap() on START and evL() fires it only while S===1, so Lap/-1 really brackets
         the climb attempt instead of mixing rest and climbing. Both sections keep identical anchors. -->
    <div id="sc1" style="position:absolute;top:0;left:0;width:100%;height:100%;visibility:VISIBLE">
      <div style="top:48%;left:5%;width:43%;height:30%">
        <div class="p-hc sp-vertical-center">
          <span class="sp-b-s" style="padding-right:4px">AVG</span>
          <span class="sp-d-s f-num"><eval input="/Activity/Lap/-1/HeartRate/Avg" outputFormat="HeartRate_Fourdigits" default="--" /></span>
        </div>
      </div>
      <div style="top:48%;left:51%;width:48%;height:30%">
        <div class="p-hc sp-vertical-center">
          <span class="sp-d-s f-num"><eval input="/Activity/Lap/-1/HeartRate/Max" outputFormat="HeartRate_Fourdigits" default="--" /></span>
          <span class="sp-b-s" style="padding-left:4px">MAX</span>
        </div>
      </div>

      <!-- Layout 4's 87% bottom row is identical in both states, so the hero cannot jump at BREAK.
           The text face is intentional: the digit-only face drops the required apostrophe. Whole
           seconds avoid a tenths digit flickering throughout every route. -->
      <div class="p-hc sp-vertical-center" style="top:calc(87% - 50%e)">
        <span class="f-ico" style="padding-right:4px">&#xF100;</span>
        <span class="sp-t-m"><eval input="/Activity/Lap/-1/Duration/Current" outputFormat="script x => Math.floor(x/60) + &quot;'&quot; + ('0' + Math.floor(x%60)).slice(-2)" default="0'00" /></span>
      </div>

      <!-- Tap markers stay bare: the old translucent panels were removed because they obscured data. -->
      <div class="f-ico" style="top:calc(24% - 18.5px);left:calc(90.5% - 50%e);color:#fff">&#xF110;</div>
      <div onTap="evL(5)" style="top:11%;left:70%;width:30%;height:25%;position:absolute"></div>
      <div class="f-ico" style="top:calc(76% - 18.5px);left:calc(90.5% - 50%e);color:#fff">&#xF200;</div>
      <div onTap="evL(6)" style="top:63%;left:70%;width:30%;height:25%;position:absolute"></div>
    </div>

    <div id="sc2" style="position:absolute;top:0;left:0;width:100%;height:100%;visibility:HIDDEN">
      <div style="top:48%;left:5%;width:43%;height:30%">
        <div class="p-hc sp-vertical-center">
          <span class="sp-b-s" style="padding-right:4px">AVG</span>
          <span class="sp-d-s f-num"><eval input="/Activity/Lap/-2/HeartRate/Avg" outputFormat="HeartRate_Fourdigits" default="--" /></span>
        </div>
      </div>
      <div style="top:48%;left:51%;width:48%;height:30%">
        <div class="p-hc sp-vertical-center">
          <span class="sp-d-s f-num"><eval input="/Activity/Lap/-2/HeartRate/Max" outputFormat="HeartRate_Fourdigits" default="--" /></span>
          <span class="sp-b-s" style="padding-left:4px">MAX</span>
        </div>
      </div>

      <div class="p-hc sp-vertical-center" style="top:calc(87% - 50%e)">
        <span class="f-ico" style="padding-right:4px">&#xF100;</span>
        <span class="sp-t-m"><eval input="/Activity/Lap/-2/Duration/Current" outputFormat="script x => Math.floor(x/60) + &quot;'&quot; + ('0' + Math.floor(x%60)).slice(-2)" default="0'00" /></span>
      </div>

      <div class="f-ico cm-bgc" style="top:calc(50% - 18.5px);left:calc(95% - 50%e)">&#xE338;</div>
      <div onTap="evX(4)" style="top:37%;left:70%;width:30%;height:25%;position:absolute"></div>
      <div class="f-ico cm-bgc" style="top:calc(76% - 18.5px);left:calc(90.5% - 50%e)">&#xE373;</div>
      <div onTap="evX(6)" style="top:63%;left:70%;width:30%;height:25%;position:absolute"></div>
    </div>

    <!-- Firmware-rendered rim gauge: the import passes through unexpanded (35 B); the old canvas
         allocated about 217 KB and evicted co-apps. -->
    <import src="#zone-g" />

    <!-- Physical pushButtons — universal events, main.js dispatches by state -->
    <:if test="{{ HAS_ON_EVENT }}">
    <userInput>
      <!-- onLongPressFull consumes the full long-press phase so the firmware button defaults
           (up=Multisport, down=Control Panel) don't fire on the app's up/down long-press actions —
           including entering EDIT/proj-setup from READY. 'next' stays free (middle = screen nav). -->
      <pushButton name="up" type="lock" longType="lock"
        onClick="ev(1)"
        onLongPressStart="evL(5)"
        onLongPressFull=";" />
      <pushButton name="next" longType="lock"
        onLongPressStart="ev(4)" />
      <pushButton name="down" type="lock" longType="lock"
        onClick="ev(2)"
        onLongPressStart="evL(6)"
        onLongPressFull=";" />
    </userInput>
    </:if>

  </div>
</uiView>
